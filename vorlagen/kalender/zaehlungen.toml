# Zählkalender (Kalender, Stufe 5): Maya, Hochland Guatemalas, Azteken und der
# 13-Monde-Kalender, öffentlich. Jede Variante ist ein eingebauter Kalender mit
# ihrer Kennung: Sie wird aktiv, wenn die Kennung in `kalender = [...]` einer
# fristen.toml steht. Welche aktiv sind, bleibt privat.
#
# Die Rechenregeln stehen im Code (src/kalender/zaehlung.rs), hier nur Namen und
# Bezugszahlen. `bezug` ist eine Julianische Tageszahl:
#   maya, hochland: die Korrelation (Tag 13.0.0.0.0 4 Ajaw 8 Kumk'u),
#   azteken-*:      der Tag 1 Coatl im Jahr 3 Calli (13.8.1521 julianisch),
#   dreamspell:     der 26.7.1987 (Kin 34).
# Namenslisten: `zeichen` 20 (je Eintrag zuerst der Name, dahinter Zweitnamen),
# `monate` 18 und die Resttage (Maya: Wayeb, Azteken: Nemontemi) in der Reihe,
# in der die Variante das Jahr zählt; beim 13-Monde-Kalender `zeichen` die 20
# Siegel, `toene` 13, `wochentage` 7, `farben` 4.
#
# Feste einer Variante stehen als [[variante.fest]] wie in den anderen
# Kalendern (kennung, titel, regel, namen), mit der Regel
# `zaehlung = { variante = "<kennung>", zahl = 1–13, zeichen = "<erster Name>" }`.

