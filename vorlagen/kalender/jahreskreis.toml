titel = "Ostara-Mond"
regel = { mondmonat = { enthaelt = "gleiche-fruehling" } }
namen = [
  { name = "Ēosturmōnaþ", sprache = "altenglisch", quelle = "Beda, De temporum ratione 15, um 725", bedeutung = "nach einer Göttin Eostre; die Göttin nennt nur Beda, ob es sie gab, ist umstritten", stufe = "belegt" },
  { name = "ostarmanoth", sprache = "althochdeutsch", quelle = "Einhard, Vita Karoli Magni 29, 9. Jahrhundert", stufe = "belegt", ungeprueft = true },
  { name = "einmánuðr", sprache = "altnordisch", quelle = "Snorri Sturluson, Skáldskaparmál, 13. Jahrhundert", stufe = "belegt", ungeprueft = true },
  { name = "Ostara-Mond", sprache = "neuheidnischer Name", quelle = "eigene Benennung nach dem Festnamen Ostara (dieser seit den 1970er Jahren)", stufe = "neuzeitlich" },
]

[[fest]]
kennung = "litha-mond"
