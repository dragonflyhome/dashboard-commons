# Ostern nach dem Mond folgt aus der Gleiche im März. Die übrigen kirchlichen
# Tage stehen nur im Kirchenjahr.
[[fest]]
kennung = "ostern"
titel = "Ostern nach dem Mond"
regel = { ostern = "gleiche-fruehling" }

# Einer von drei Donnerstagen, die getrennt benannt stehen: dieser im Jahreskreis,
# Christi Himmelfahrt und Fronleichnam im Kirchenjahr. Der Tag der Gleiche selbst zählt nicht.
[[fest]]
kennung = "ostara-donnerstag"
titel = "Erster Donnerstag nach Ostara"
regel = { wochentag = "donnerstag", nach = "ostara" }

[[fest.namen]]
name = "Donnerstag nach Ostara"
sprache = "eigene Benennung"
quelle = "eigene Benennung nach dem Festnamen Ostara (dieser seit den 1970er Jahren)"
stufe = "neuzeitlich"

# Die vier Sonnenmonate: der Monat mit dem Sonnentag. Er trägt eigene alte Namen
# (der erste steht neben dem Monat); die Stufe des Festnamens gilt auch für ihn.

[[fest]]
