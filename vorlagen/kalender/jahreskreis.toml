# Kalender „Jahreskreis“ nach Sonne und Mond (Nordhalbkugel).
# Eingebaut in den Dienst; welche Kalender angezeigt werden, steht im Projekt `kalender`.
# Regelarten und Prüfung: src/kalender/mod.rs.
#
# Aufbau:
# - Feste mit Tag sind nur die vier Sonnentage (Wenden und Gleichen), am Tag des
#   berechneten Zeitpunkts in Ortszeit.
# - Ein Monat läuft von Neumond zu Neumond und heißt nach seinem Vollmond. Die
#   Sonnenmonate enthalten einen Sonnentag; Imbolc, Dreimilch-Mond, Lughnassad und Samhain
#   sind der Monat um den 2., 5., 8. und 11. Vollmond nach dem kürzesten Tag (ein
#   Vollmond am Tag der Wende zählt nicht). Als Termin zählt der Anfang des Monats.
# - Das Festjahr läuft vom Monat mit der Wintersonnenwende bis vor den nächsten
#   (12 oder 13 Monate).
# - Jede Jahreszeit beginnt mit dem Neumond, der einen der vier Mondmonate beendet,
#   und zählt ihre Monate durch („1. Wintervollmond“); der Sonnenmonat zählt mit.
#
# Namen: zuerst der sprechende, daneben überlieferte mit Quelle und Stufe
# (belegt, erschlossen, neuzeitlich). Die Zuordnung alter Monatsnamen zu diesen
# Mondmonaten ist eine eigene, ungefähre Zuordnung über die Monatsmitte; keine
# Quelle ordnet einen Namen dem n-ten Vollmond zu. Der achtteilige Jahreskreis
# als Ganzes ist neuzeitlich (Mitte des 20. Jahrhunderts). `ungeprueft = true`:
# Zuordnung oder Deutung nur aus allgemeinen Nachschlagewerken, nicht gegen eine
# Fachausgabe geprüft.
kennung = "jahreskreis"
titel = "Jahreskreis"

# Die vier Sonnentage

[[fest]]
kennung = "yule"
titel = "Mittwinter (Yule)"
regel = { himmel = "sonnenwende-dezember" }

[[fest.namen]]
name = "Giuli"
sprache = "altenglisch"
quelle = "Beda, De temporum ratione 15, um 725"
bedeutung = "Das Wort ist belegt, seine Herkunft ungeklärt; bei Beda der Name der zwei Monate um die Wintersonnenwende."
stufe = "belegt"

[[fest.namen]]
