  { name = "Līþa", sprache = "altenglisch", quelle = "Beda, De temporum ratione 15, um 725", bedeutung = "„mild, schiffbar“; Beda nennt zwei Monate um die Sommersonnenwende so, in Jahren mit 13 Monden drei (Thrilithi)", stufe = "belegt" },
  { name = "heuuimanoth", sprache = "althochdeutsch", quelle = "Einhard, Vita Karoli Magni 29, 9. Jahrhundert", stufe = "belegt", ungeprueft = true },
  { name = "sólmánuðr", sprache = "altnordisch", quelle = "Snorri Sturluson, Skáldskaparmál, 13. Jahrhundert", stufe = "belegt", ungeprueft = true },
