  { name = "Giuli", sprache = "altenglisch", quelle = "Beda, De temporum ratione 15, um 725", bedeutung = "Beda nennt die zwei Monate um die Wintersonnenwende Giuli; das Wort ist belegt, seine Herkunft ungeklärt.", stufe = "belegt" },
  { name = "heilagmanoth", sprache = "althochdeutsch", quelle = "Einhard, Vita Karoli Magni 29, 9. Jahrhundert", stufe = "belegt", ungeprueft = true },
  { name = "hrútmánuðr", sprache = "altnordisch", quelle = "Snorri Sturluson, Skáldskaparmál, 13. Jahrhundert", stufe = "belegt", ungeprueft = true },
  { name = "jiuleis", sprache = "gotisch", quelle = "gotisches Kalenderfragment", bedeutung = "Lesung und Deutung umstritten", stufe = "belegt", ungeprueft = true },
]

[[fest]]
