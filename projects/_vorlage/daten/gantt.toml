# Balkenplan (Baustein Gantt). Eingabe von Hand: Name, von, bis, Farbe.
# Daten als "JJJJ-MM-TT" (oder "JJJJ-MM", dann rechnet der Server aber keine
# Tage); oder Plan-Monate als Zahlen (von = 0, bis = 3) mit start = "JJJJ-MM".
# Nie beides mischen.
# Farbe ist eine Bedeutung: ok/fertig, laeuft/aktiv, wartet, problem, info, neutral.
# Der Server zählt erledigte Balken (farbe = fertig) selbst, siehe kennzahlen.toml.

