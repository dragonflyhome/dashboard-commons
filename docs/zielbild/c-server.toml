[[block]]
titel = "Sicherheitsgrenzen"
punkte = [
  "Nur 127.0.0.1, plus Adress-Prüfung.",
  "Keine Route gibt einen Schlüsselwert zurück (Test durchsucht jede Antwort).",
  "Persönliche Daten: data/schluessel.toml enthält keine E-Mail-Adresse. Damit der Tresor-Eintrag zuordenbar bleibt, bekommt /schluessel ein Feld „Benutzername“, das nur im Tresor landet.",
  "Schreibende Wege: Schlüssel speichern, Frage beantworten, Bau über den Vorgang bau, und Server-Teile in src/projekte/. Alle hinter Schleusen 3–6.",
  "Projekt-Code läuft in der Oberfläche mit. Darum: kein fetch und kein {@html} im Projekt-Code (ESLint), Daten nur als Props. Ein Projekt kann so nicht aus Versehen Antworten im Namen des Benutzers schicken oder fremde Daten holen.",
  "Der Scanner schützt vor Versehen, nicht vor Absicht. Projekt-Code steht im selben Layout wie die Knöpfe für Antworten und Haken; „nur aus dem Browser“ ist eine Prüfung von Kopfzeilen. Eine Antwort ist darum nie ein Nachweis und gibt nie allein eine riskante Handlung frei. Eine Scanner-Regel gegen document., .click() und dispatchEvent steht als Auflage aus (A2/A3).",
  "CSP der Oberfläche: default-src 'self', connect-src 'self', frame-src 'self', frame-ancestors 'none', keine Inline-Skripte.",
  "CSP für Vorschau-HTML: wie die Oberfläche, plus sandbox allow-scripts.",
]
