titel = "Oberfläche und Bau"
reihenfolge = 6

[[block]]
titel = "Grundentscheidung"
text = """Eine SvelteKit-App, ssr = false, adapter-static, ausgeliefert vom Rust-Server. Keine Remote Functions (experimentell, brauchen einen Node-Server). Fallback-Datei 200.html."""

[[block]]
titel = "Kopfleiste (Fassung 3)"
text = """Links Brotkrumen: das Symbol führt zur Startseite, das letzte Glied lädt die Seite neu und scrollt nach oben. Rechts PC-Symbol mit kleinem Echtzeit-Verlauf der Prozessorlast, Glocke mit Zahl der Meldungen (ersetzt das Band), Live-Punkt mit fünf Zuständen und Schloss. Das Menü oben entfällt; links eine Seitenleiste mit Anstehend, den Projekten (Unterseiten eingerückt darunter) und den Dashboard-Seiten, am Handy als Schublade. Ganzer Text: Entscheidung kopfleiste (Abschnitt Entscheidungen; Teile [fassung_2_schloss], [fassung_2_live_zustaende], [fassung_2_passkey_wege], [fassung_3])."""

[[block]]
titel = "Wie Projektseiten in die App kommen"
beispiel = """// web/src/lib/projekte.generated.ts  (vom Baumeister geschrieben)
export const seiten = {
  garten: {
    haupt: () => import('../../../projects/garten/Seite.svelte'),
    unter: { 'beet-a': () => import('../../../projects/garten/seiten/beet-a.svelte') }
  },
  // nur Projekte, deren Prüfung grün war
};"""

[[block]]
punkte = [
  "Jede Projektseite ist ein eigener Teil des Baus (Chunk) und wird erst geladen, wenn man sie öffnet.",
  "Die Liste schreibt der Baumeister, nur mit Projekten, deren Prüfung grün ist. Ein kaputtes Projekt kann den Bau also nicht brechen.",
  "Zur Laufzeit steckt jede Projektseite in einer Fehlergrenze (<svelte:boundary>): Wirft sie beim Zeichnen einen Fehler, steht dort „Diese Seite hat gerade einen Fehler“ mit Knopf „neu versuchen“; der Rest des Dashboards läuft weiter. Fehler in Klick-Funktionen fängt die Grenze nicht (so die Svelte-Doku); dafür fängt das Projekt-Layout sie mit onerror am Fenster ab und zeigt dieselbe Meldung.",
]

[[block]]
text = """Routen:"""

[[block]]
beispiel = """routes/
  +layout                        Kopfzeile, Live-Kanal, Projektliste, Bau-Hinweis
  +page                          Start: Cockpit, Kacheln, offene Fragen
  fragen/  pc/  schluessel/      wie bisher
  katalog/                       alle Bausteine und Token, hell/dunkel, breit/schmal
  anleitung/  zielbild/  entscheidungen/   System-Seiten (statt .md)
  projects/[slug]/
    +layout                      Kopf (projekt.toml), Seitenleiste, Fehlergrenze
    +page                        lädt Seite.svelte des Projekts
    [unterseite]/+page           lädt seiten/<name>.svelte
    fragen/  vorschau/"""

[[block]]
titel = "Der Baumeister: von der Svelte-Datei zur Seite"
beispiel = """Assistent speichert Seite.svelte (nur .svelte/.ts lösen einen Bau aus, TOML nie)
 → Beobachter merkt es
 → 5 s Ruhe abwarten (oft werden mehrere Dateien geschrieben)
 → pruefe <slug>: TOML, Assets, Stil, ESLint, svelte-check, Vitest – nur für dieses Projekt
 → rot: Projekt bleibt in seiner letzten grünen Fassung; Ereignis bau/rot mit Meldung
 → grün: projekte.generated.ts neu (nur grüne Projekte)
 → Gesamtprüfung (svelte-check über alles): fängt Fehler, die erst beim
   Zusammenbau entstehen; bei rot das Projekt der ersten Meldung ausschließen
   und noch einmal (höchstens zwei Runden)
 → vite build nach web/builds/<n>/
 → Bau grün: Zeiger umstellen (im Speicher und in der Datei web/builds/aktuell),
   Ereignis fassung, alte Fassungen bis auf 2 löschen
 → Bau rot: alte Fassung bleibt, Meldung auf der Startseite"""

[[block]]
punkte = [
  "Kein import.meta.glob: Das würde alle Projekte zur Bauzeit einsammeln, auch rote, und der Bau fiele um. Nur die vom Baumeister geschriebene Liste mit expliziten import().",
  "Ein Bau zur Zeit, Zeitlimit 120 s, danach wird der Kindprozess beendet. Kommen währenddessen Änderungen, folgt genau ein weiterer Bau.",
  "Niedrige Priorität: Der Bau läuft unter Windows mit BELOW_NORMAL, damit das Cockpit beim Speichern nicht ruckelt.",
  "Neustart des Servers liest web/builds/aktuell und zeigt sofort die letzte gute Fassung, ohne zu bauen.",
  "Kein Bau-Knopf auf der Projektseite: gebaut wird von selbst nach dem Speichern. Verpasst der Beobachter etwas, stößt ein Assistent den Bau über den Vorgang bau an. POST /api/bauen gibt es seit 6d nicht mehr; GET /api/bauen zeigt nur den Stand.",
  "Gemessen mit warmem Cache: vite build 3,8 s, svelte-check 3,9 s, Vitest 4,0 s, ESLint 49,8 s über alles. ESLint ist also der Engpass; darum läuft es je Projektordner mit --cache, nie über alles. Ziel: unter 30 s vom Speichern bis zur Seite; Grenze: 60 s. ESLint je Projektordner mit --cache wird in Etappe 4 gemessen, bevor „sichtbar nach 10–30 s“ ein Versprechen ist.",
  "„Bleibt in alter Fassung“ heißt: Der Baumeister merkt sich je Projekt den letzten grünen Stand als Kopie unter web/.projekte-gruen/<slug>/ und baut mit dieser, solange die neue rot ist. Man sieht nie eine halbe Seite.",
  "Der Baumeister läuft im Rust-Server als eigenes Modul mit eigener Tokio-Aufgabe und Warteschlange und startet npm als Kindprozess. Kein zweites Programm: gestartet wird genau eines.",
  "Für Projekt-Assistenten beim Arbeiten: npm run pruefe -- <slug> im Ordner web zeigt dieselben Meldungen sofort, ohne auf den Baumeister zu warten.",
  "Ein Svelte-Entwicklungsserver (vite dev) bleibt nur für den Bau-Assistenten in seinem Worktree. Ein eigener Dev-Server je Projekt-Assistent wäre zu viel.",
]

[[block]]
titel = "Prüfung je Projekt, damit sich niemand gegenseitig bricht"

[block.tabelle]
spalten = ["Prüfung", "Bereich", "Was sie ablehnt"]
zeilen = [
  ["TOML", "projekt.toml, daten/*.toml", "falsche Felder, Wörter, Daten"],
  ["Assets", "assets/", "Formate, Größen, SVG-Regeln"],
  ["Stil (Stylelint)", "<style> in *.svelte des Projekts", "Farben (#…, rgb(), hsl(), Farbnamen), font-family und font-size außer Token, @import, url(http…), :global, !important; Farb-, Rand-, Schatten- und Schrift-Eigenschaften müssen var(--…) sein (Ausnahmen transparent, inherit, currentColor)"],
  ["Stil im Markup (Vitest-Test)", 'style="…", fill=, stroke= in *.svelte', "feste Farbwerte außerhalb von var(); meldet Datei und Zeile"],
  ["ESLint", "projects/<slug>/**", "fetch, EventSource, WebSocket, localStorage, sessionStorage, indexedDB, document.cookie, {@html}, Modul-Skripte mit Nebenwirkungen, Imports außer $katalog, $vertrag, svelte und eigenen Dateien"],
  ["svelte-check", "projects/<slug>/**", "Typfehler"],
  ["Vitest", "projects/<slug>/**/*.spec.ts", "eigene Tests des Projekts"],
]

[[block]]
text = """Für die Stil-Prüfung kommt Stylelint dazu (mit postcss-html und stylelint-declaration-strict-value): Es ist der einzige Weg, der die <style>-Blöcke in Svelte wirklich prüft, ESLint kann es nicht. Drei npm-Pakete nur für die Prüfung, nichts davon läuft im Browser. Die Regeln gelten zuerst für Katalog und Hülle (dort standen bisher 15 Stellen mit festen Farben, davon 10 in pc/Folders.svelte), dann für die Projekte. Aliase $katalog und $vertrag über kit.alias in vite.config."""

[[block]]
titel = "Server-Teile einzelner Projekte"
punkte = [
  "Kein server.rs im Projektordner und kein build.rs, das Projektordner einbindet (Fassung 2 hatte das; gestrichen, Begründung im Abschnitt „Inhaltsmodell: Ein Projekt ist ein Ordner mit drei Sprachen“).",
  "Braucht ein Projekt einen Server-Teil, baut ihn der Bau-Assistent auf Wunsch als src/projekte/<slug>.rs mit pub fn routen() -> Router<AppState>, eingehängt unter /api/projekt/<slug>/, hinter allen Schleusen.",
  "Nach dem Zusammenführen startet scripts/Dienst.ps1 -Neustart den Server neu (bauen, alten Prozess beenden, neuen starten); der Live-Kanal verbindet sich selbst wieder, die Oberfläche kommt aus web/builds/aktuell.",
]

[[block]]
titel = "API-Vertrag aus einer Quelle"
text = """Alle Typen stehen in src/vertrag/. ts-rs schreibt daraus beim cargo test die TypeScript-Typen nach web/src/lib/vertrag/ (eingecheckt, Import als $vertrag). cargo test schlägt fehl, wenn sie nicht zu Rust passen (festgelegt bei der Abnahme 2c: die Quelle ist Rust, also prüft cargo test). Dieselben Typen lesen die TOML-Dateien (serde). Ein Typ, drei Nutzungen: TOML lesen, JSON schicken, TypeScript prüfen."""

[[block]]
titel = "Daten live, App-Fassung getrennt"
text = """
Daten und App-Fassung sind zwei Dinge. Daten kommen immer live vom Server und sind auf jeder Seite aktuell. Die App-Fassung ist der Bau der Oberfläche, die gerade im Browser geladen ist. Auf der Projektseite gibt es dafür keine eigene Zeile und keinen Knopf.

Nur wenn die geladene App-Fassung veraltet ist, steht im Bereich „live, angemeldet“ der Hinweis „Daten live, App wird gleich aktualisiert“. Die App lädt nach 30 Sekunden von selbst neu; ein Klick ist nur eine Abkürzung, aber nie mitten in einer Eingabe oder einer offenen Antwort."""

[[block]]
punkte = [
  "Drei Fälle: Keine Verbindung zum Dienst (Daten können veraltet sein; kein Neuladen, neuer Versuch alle paar Sekunden). App veraltet (Hinweis wie oben). Neue Fassung wird gebaut (eine Svelte- oder TS-Datei wurde geändert; kein Klick nötig, danach weiter mit App veraltet). Keine Verbindung geht vor, Bau läuft geht vor App veraltet.",
  "Veraltet heißt: Der Server meldet über den Live-Kanal eine Fassung mit neuerer Bau-Kennung als die, mit der die Seite geladen wurde. Gleiche Kennung: kein Hinweis.",
  "Von selbst neu geladen wird erst, wenn kein Eingabefeld Fokus oder ungespeicherten Text hat und keine Antwort offen ist; sonst bleibt der Hinweis stehen, bis der Nutzer klickt oder fertig ist.",
  "Vorlese-Programme hören den Hinweis einmal, nicht bei jedem weiteren Ereignis.",
  "Ohne Anmeldung gilt dasselbe ohne Satz aus dem Bau; frei sind nur Zustand und Zeit.",
]

[[block]]
titel = "Daten und Live-Zustand"
punkte = [
  "Seitendaten nur aus load mit depends(„api:projekt:<slug>“).",
  "Live-Kanal (live.svelte.ts, Runes) übersetzt Ereignisse in gezielte invalidate-Aufrufe; bei fassung lädt er die Oberfläche neu.",
  "Projekt-Komponenten bekommen alles als Props, holen nie selbst.",
  "Immer aktuell: Jede Seite hält ihre Daten über den Live-Kanal (frei oder geschützt) von selbst aktuell. Jede Änderung, die der Server bemerkt (TOML gespeichert, Vorgang, Antwort, Meldung, PC-Wert, Bau), wird ein Ereignis, und jede Seite, die diese Daten zeigt, lädt sie gezielt nach. Keine Seite liest nur beim Öffnen. Das letzte Brotkrumen-Glied ist eine Aktualitätsprüfung: Stand mit dem Server abgleichen (Ereignisnummer), fehlende Änderungen nachziehen, nach oben scrollen; keine neue Browserseite. Nach einem neuen Bau (Ereignis fassung) wechselt die Oberfläche selbst, ohne Zutun und ohne Eingaben zu verlieren (4c). Ist der Kanal unterbrochen, sagt das der Live-Punkt; nach dem Wiederverbinden zieht die Seite alles nach, was dazwischen geschah.",
  "Server: Fakten und Fachgrößen. Oberfläche: Front-Office und Erlebnis. Der Server liefert gut strukturierte Fachdaten: was da ist, in welchem Stand, bis wann (Frist), wie dringend (Stufe) und ob eine Regel erfüllt ist, etwa beim Backup die 3-2-1-Regel mit erfüllt, teilweise oder nicht erfüllt. Solche Regeln rechnet nur der Server, mit Tests, damit jede Seite dasselbe Ergebnis zeigt. Die API weiß nichts über Widgets: keine Kachel, Karte, Icon, Farbe, kein Layout. Wo die Oberfläche zuordnen muss, liefert sie fachliche Kennungen. Die Oberfläche entscheidet, wie es aussieht und wie man damit arbeitet: Farbe (bedeutung), Satz, Beschriftung, Reihenfolge, Gruppierung, Filter und welche Frage zuerst kommt. Mehrere Widgets lesen denselben Endpunkt. Faustregel: Ändert sich die Sache, wenn nur die Seite neu gestaltet wird? Dann gehört sie in die Oberfläche, sonst in den Server. Beispiel: backup_stand mit kopien (ort, stand, text) und regel_321 aus /api/pc. Prüfpunkt jeder Abnahme. Siehe Entscheidung zustand-vom-server (Abschnitt Entscheidungen).",
  "Backend: Zustand der Projekte. Frontend: Auswertung des Dashboards. Zum Zustand gehören Daten, Fakten, Fachgrößen, Verlauf und Vorgänge je Projekt. Zur Auswertung gehören Zusammenfassen, Zählen über Projekte, Sortieren, Hervorheben und die Übersichten „Anstehend“, „Jetzt für dich“ und die vier Teile der Projektseite. Beispiel: /api/anstehend liefert die Einträge mit Stufe und Frist je Projekt; Übersicht und Zähler rechnet das Frontend (Schritt 3a+). Ausnahme aus Sicherheit: /stand ohne Anmeldung gibt weiter nur Zahlen aus, weil dort keine Einträge sichtbar sein dürfen. Zweite Ausnahme: Die Ampel eines Projekts (Bedeutung, Grund, Bezug) rechnet der Server, damit Startseite, Karte und Kopf dieselbe Aussage zeigen.",
  "Projektseite in vier Teilen, jeder mit genau einer Frage, in fester Reihenfolge über dem Inhalt: Stand (Wie geht es dem Projekt? Zahlen und Ampel mit Grund-Satz), Aufgabenliste (Was ist jetzt zu tun, und von wem? die einzige Liste; Fragen und Aufgaben werden dort beantwortet), Plan (Wo stehen wir im Ganzen? Etappen mit Stand-Wort, Zählung und einem Zeitstreifen nur aus Ist-Daten), Zeitleiste (Was ist geschehen, was kommt? aus Tracker, Fragen, Entscheidungen, Bau und Fassungen, Routine verdichtet). Kein Inhalt steht in zwei Teilen. Die Seite des Projekts darunter zeigt nur Inhalt, keinen Stand.",
]

[[block]]
titel = "Formsprache: vier Schichten"
text = """Das Dashboard nutzt ein gutes, modernes, Svelte-natives UI-Toolkit, als Kopie im eigenen Repo (Vendor) und selbst gepflegt. Toolkit heißt: eine fertige Sammlung von Bedienteilen (Menü, Dialog, Reiter, Aufklapper, Tooltip), die Tastatur und Bildschirmleser schon richtig können."""

[[block]]
beispiel = """Token  ->  Toolkit (Vendor)  ->  Katalog ($katalog)  ->  Projektseiten"""

