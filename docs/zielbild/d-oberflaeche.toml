[[block]]
titel = "Token und Katalog"
punkte = [
  "Token in web/src/lib/katalog/token.css. Vorhanden (in app.css): Flächen und Text (--bg, --card, --text, --muted, --line, --shadow, --radius), Akzent, Bedeutungsfarben (--ok, --warn, --bad, --plan, --done, --info), Schrift (--font, --mono). Fehlt und kommt dazu: Abstände (--abstand-1 bis --abstand-6), Schriftstufen (--fs-*), Rundungen, Fokus- und Hover-Farben, Dauer und Kurven für Bewegung, Breiten (360 px, Mitte, 1180 px), eine Palette für Kategorien (--kat-1 bis --kat-10, etwa für Ordnerfarben). Schriften: nur die des Systems.",
