[block.tabelle]
spalten = ["Schicht", "Ort", "Wer pflegt", "Wer darf es benutzen"]
zeilen = [
  ["Token", "web/src/lib/katalog/token.css", "Bau-Assistent", "alle (nur als var(--…))"],
  ["Toolkit", "web/vendor/<paket>/", "Bau-Assistent", "nur der Katalog"],
  ["Katalog", "web/src/lib/katalog/", "Bau-Assistent", "alle Seiten"],
  ["Projektseiten", "projects/<slug>/", "Projekt-Assistenten", "–"],
]

[[block]]
punkte = [
  "Das Toolkit liefert Verhalten (Fokus, Tastatur, ARIA, Öffnen und Schließen); das Aussehen kommt aus den Token. Darum ist ein ungestyltes (headless) Toolkit die erste Wahl; eines mit eigenem Aussehen nur, wenn sich dieses vollständig über unsere Token steuern lässt.",
  "Projektseiten importieren das Toolkit nie direkt. Die ESLint-Grenze (nur $katalog, $vertrag, svelte, eigene Dateien) erzwingt das. So lässt sich das Toolkit tauschen, ohne ein Projekt anzufassen.",
  "Vendor-Kopie: je npm-Paket ein Ordner web/vendor/<paket>/ mit dem unveränderten Inhalt aus der Registry, der Original-Lizenz und HERKUNFT.toml (Version, Datum, Prüfsumme der Registry, entfernte Dateien). web/package.json zeigt mit „file:vendor/<paket>“ darauf; npm ci braucht dafür kein Netz. Alle Pakete, die zur Laufzeit gebraucht werden, auch die indirekten, liegen dort; sonst holt npm ci sie doch aus dem Netz.",
  "Keine eigenen Änderungen am Code der Kopie. Die einzige erlaubte Änderung: Markdown-Dateien des Pakets (README.md, CHANGELOG.md) werden entfernt und in HERKUNFT.toml unter entfernt aufgeführt; eine Lizenz als LICENSE.md wird inhaltsgleich zu LICENSE.txt.",
  "Aktualisieren: scripts/Vendor-Pruefen.ps1 meldet neue Fassungen und Lizenzen; scripts/Vendor-Holen.ps1 holt eine Fassung in einen leeren Ordner, prüft Prüfsumme und Lizenz, ersetzt, dann npm ci, npm run verify und Sichtprüfung im /katalog. Ein Commit je Paket, nie zusammen mit eigenem Code. Das passiert in Katalog-Runden.",
]

