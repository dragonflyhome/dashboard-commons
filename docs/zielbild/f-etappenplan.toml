[[block]]
text = """
Jede Teil-Etappe (1a, 1b, …) ist ein eigener Merge, den der Prüf-Assistent einzeln abnimmt.

Ablauf der Abnahme: Der Bau-Assistent baut im Worktree und meldet „bereit zur Abnahme“ mit Branch und Commit. Der Prüf-Assistent prüft das Abnahmekriterium, die Tests (cargo test, npm run verify), die Anleitung und die Verständlichkeit für den Benutzer. Er sagt „Ja“ oder konkret, was fehlt. Erst nach dem Ja folgt die Zusammenführung nach main. Merge-Commits sind Pflicht, Fast-Forward gibt es nie. Die Nachricht nennt Etappe oder Modul, die Spitze des Zweigs und den Hash der Abnahme.

Dabei gilt der Abschnitt „Teilschritte mit Besitzer“: Die Abnahme ist seit T5 ein eigener Schritt der Arbeit, dessen Besitzer (Feld fuer) der Prüf-Assistent ist. Der Vorgang der Art abnahme war eine abgelöste Übergangsregel. Die Übergabe ist erst vollzogen, wenn der Prüf-Assistent den angebotenen Schritt im Dashboard übernommen hat. Eine Nachricht allein ist keine Übergabe. Zweig, Commit und Dauer von Bau und Test stehen in der Notiz des eigenen Bau-Schritts (gesetzt, bevor er fertig ist), nicht in einer Nachricht. Den Stand jeder Etappe zeigt der Tracker (Kasten Arbeiten).
"""

