  ["Prüf-Assistent", "zieht ein Pilotprojekt als Erster um und prüft das Werkzeug daran"],
  ["Projekt-Assistenten", "führen umziehen für ihr Projekt aus, glätten die Seite, pruefe grün, committen ihren Ordner (page.md weg)"],
  ["Prüfer", "zählt täglich: Projekte neu / alt, Markdown-Dateien übrig"],
]

[[block]]
text = """
Reihenfolge: Pilot → kleine Seiten → mittlere Seiten → große Seiten (dort gleich in Unterseiten teilen). Welche Projekte in welche Gruppe gehören, steht im privaten Inhalt.

Alt und neu nebeneinander: Ab Etappe 4 zeigt der Server ein Projekt in neuer Form, sobald projekt.toml da ist. Sonst zeigt er es wie bisher aus page.md (mit gelbem Hinweis „alte Form“). Das gilt höchstens sieben Tage nach Ende des Piloten. Dann folgt Etappe 6: Der Markdown-Weg wird entfernt. Eine Seite, die bis dahin nicht umgezogen ist, zieht der Bau-Assistent mit dem Werkzeug um, ohne Glätten.
"""

