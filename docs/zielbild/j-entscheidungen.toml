[[block]]
text = """
Fremde Dienste hinter einer Brandmauer. Ein fremder Dienst (etwa ein Notizdienst) ist höchstens eine zusätzliche Quelle oder Ablage, hinter einer abgegrenzten Schnittstelle: eigenes Modul, eigener Teil im Vertrag, kein Kern-Baustein liest ihn direkt. Keine Kernfunktion hängt von ihm ab. Fällt er aus oder fehlt der Zugang, laufen Dashboard, Projektseiten, Datenspeicher, Aufgaben, Fragen und Rechenteile unverändert weiter; die Seite sagt nur, dass diese Quelle gerade fehlt.

Fremde Dienste nur mit Bestätigung. Nichts im Dashboard spricht von selbst mit einem fremden Dienst: kein Zeitplan, kein Hook, kein Lauf beim Start. Jeder Lauf braucht ein ausdrückliches Ja zu genau diesem Lauf, und das Ja gilt einmal. Ganzer Text: Entscheidung inhaltsquellen in docs/entscheidungen/.

Grundsatz für Grundsatzfragen: Vorgelegt werden nur Fragen, die Richtung, Sicherheit, Daten oder Geld betreffen. Gestaltung entscheidet der Bau-Assistent selbst, mit Begründung in einer Entscheidungsnotiz; der Prüf-Assistent prüft sie gegen das Zielbild.

Keine Etappe wartet auf eine Gestaltungsfrage. Eine Gestaltungswahl verdeckt nur sich selbst; hält sie trotzdem eine Etappe auf, fehlt ein Platzhalter, und das ist ein Fehler in der Prozessabhängigkeit. Fehlt eine Entscheidung zur Gestaltung (etwa ein Logo), baut die Etappe mit einem Platzhalter weiter. Die Frage läuft nebenher im Dashboard; ihre Antwort ist später ein Tausch von Dateien oder Daten, keine neue Etappe und kein Halt. Eine Abnahme verlangt nie eine getroffene Wahl, nur „Platzhalter steht und lässt sich tauschen“. Ganzer Text: Entscheidung kein-halt-fuer-gestaltung in docs/entscheidungen/.
"""
