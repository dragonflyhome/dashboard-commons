[[block]]
titel = "Seite /daten"
punkte = [
  "Ort der Datei, Größe, Schema-Version.",
  "Letzte Sicherung (grün: vom selben Tag, gelb: älter als 2 Tage, rot: älter als 7 Tage) und letzter Stand der externen Sicherung, sobald es sie gibt.",
  "Zahl der Einträge je Tabelle (Vorgänge offen/gesamt, Antworten, Bau-Läufe …).",
  "Knopf „als TOML ansehen“ / „als JSON herunterladen“ (GET /api/daten/export?format=toml|json). Der Export enthält nie Passwörter, weil keine im Datenspeicher sind.",
