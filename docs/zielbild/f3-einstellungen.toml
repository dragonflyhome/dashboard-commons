text = """
Die Farbwahl und der Satz „Dein Dashboard läuft nur hier auf diesem PC.“ ziehen aus dem Fuß jeder Seite auf eine eigene Seite Einstellungen (Etappen S1 bis S4). Die Seite kommt nach dem Umzug der Projektseiten (Etappe 5). Dort gibt es mehr als Hell und Dunkel.

Die Wahl gilt sofort, nur in diesem Browser, und geht nirgendwohin."""

