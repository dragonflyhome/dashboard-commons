  ["T2", "Speicher: anlegen, übernehmen, ändern in je einer Transaktion; abgeleiteter Stand; Schritt 1 „bisherige Arbeit“; Warten auf Schritte mit Zurückwecken; verwaist; Grenzen (20 Schritte, 500 Verlaufseinträge -> 429, 30 offene Arbeiten auch beim Wiederöffnen)", "fremd -> 409 ohne Schreiben; doppelt -> unverändert; zwei zugleich -> genau ein 409; Fall 6b mit Funde-Runde endet ohne Stillstand; Kette zu sich selbst -> 422"],
  ["T3", "API, wer_ruft, Titel-Lücke zu, Weck-Vorgänge; die Anleitung mit von in jedem Aufruf kommt gleich mit", "409-Körper nennt Besitzer; ohne von -> 422; Browser -> 422; Wartender wird nach fertig geweckt; alter Weck-Vorgang wird erledigt"],
  ["T4", "Anstehend und Oberfläche: Zeile in der Zusammenfassung, Liste der Schritte, wartet auf den Inhaber aus allen Schritten", "Wörter statt Farbe, 360 px, hell und dunkel"],
  ["T5", "Arbeitsregel in der Anleitung, danach Etappe 6 im Tracker in Schritte teilen und die Handdateien auf den Verweis umstellen", "Abnahme durch den Prüf-Assistenten"],
]

[[block]]
titel = "Bewusst weggelassen"
punkte = [
  "Schritte in Schritten und feste Abhängigkeiten zwischen Schritten: die Nummern und das Warten auf einen Schritt genügen, Schritte dürfen parallel laufen.",
  "Eine Sperre mit Zeitablauf, die von selbst zurückfällt: der Server ändert keinen Besitz allein.",
  "Ein Nachweis der Chat-Identität: kommt mit dem Chat-Schlüssel.",
  "Warten über mehrere Arbeiten hinweg: jede Übergabe gehört in die Arbeit, um die es geht.",
