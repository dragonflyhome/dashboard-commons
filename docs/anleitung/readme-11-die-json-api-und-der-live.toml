# Abschnitt „Die JSON-API und der Live-Kanal“ (Etappe 6b, Format wie docs/zielbild).
titel = 'Die JSON-API und der Live-Kanal'
reihenfolge = 211

[[block]]
text = '''
Der Rust-Server liefert alle Daten als JSON; die Oberfläche lebt davon. Nur lesend bis auf POST /api/daten/sichern, POST /schluessel/<name> und die POSTs der Vorgänge, Aufgaben, Arbeiten, Einstufungen, Antworten und Meldungen; nur von diesem PC aus. Ein Feld form gibt es seit 6d in keiner Antwort mehr (/api/projects, /api/projekte/<slug>, …/stand, /api/pruefung): Es gibt nur noch eine Form.

Adresse: Der Server hört auf 127.0.0.1 und auf [::1]. Im Browser gilt http://localhost:8787. Grund: Seit Etappe 7b prüft der Dienst mit der integrierten Windows-Anmeldung, dass Anfragen von Ihrem Konto kommen. Edge und andere Browser auf Chromium-Grundlage (auch eingebettete) melden auf localhost ohne Rückfrage an, auf 127.0.0.1 gar nicht; die Passkeys ab 7c brauchen localhost ohnehin. Weil Windows localhost zuerst als ::1 auflöst, hört der Server auch dort, sonst lädt die Seite mit Verzögerung. 127.0.0.1 bleibt für scripts/Api.ps1, scripts/Warten.ps1 und die Lebenszeichen.'''

