[[block]]
text = '''
Die POSTs der Vorgänge (/api/vorgaenge, …/uebernommen, …/erledigt) nehmen nur Anfragen mit Content-Type: application/json, auch bei leerem Körper; sonst antwortet der Server mit 415 und dem Satz „Bitte den Körper als JSON schicken (Content-Type: application/json).“ Dasselbe gilt für die POSTs der Aufgaben, Arbeiten, Einstufungen, Antworten (POST /api/antworten/<slug>/<id>) und Meldungen (POST /api/meldungen; …/gelesen mit leerem Körper geht auch ohne).

Die Chats rufen die API mit scripts/Api.ps1 ohne Origin auf. Das ist nur auf /api/vorgaenge, /api/aufgaben, /api/arbeiten, /api/einstufung, /api/anstehend, /api/antworten und /api/meldungen (je mit allem darunter) erlaubt; alle anderen POSTs verlangen weiterhin eine Herkunft vom Dashboard selbst, und Anfragen fremder Websites bleiben auch hier 403. Umgekehrt nehmen der Haken bei Aufgaben, das Einstufen, das Beantworten von Fragen und „gelesen“ an Meldungen nur Anfragen mit Origin oder Sec-Fetch-Site an („nur aus dem Browser“, per Api.ps1 ohne Origin 422). Das ist eine Prüfung der Kopfzeilen gegen Versehen, keine Sicherheitsgrenze: Wer die Kopfzeilen selbst setzt, kommt durch.

Anmeldung von Skripten: PowerShell mit -UseDefaultCredentials (in PowerShell 7 dazu -AllowUnencryptedAuthentication) meldet sich auf 127.0.0.1 und localhost an, der Browser nur über localhost. scripts/Api.ps1 macht das für die Chats. Seit 7b ist die Anmeldung auf den geschützten Wegen Pflicht (Tabelle im Abschnitt „Anmeldung“). Beispiel:'''

[[block]]
beispiel = '''
pwsh -NoProfile -File %USERPROFILE%/dev/dashboard/scripts/Api.ps1 "api/vorgaenge?fuer=<slug>&offen=1"'''

[[block]]
text = '''
Nicht mit curl: Das curl 8.22 von Windows (KB5127936) kann kein NTLM und bekommt nur 401, das aus Git oder MSYS2 konnte es nie. scripts/Api.ps1 fragt über .NET (scripts/Anfrage.ps1).

Der Beobachter prüft die Ordner alle zwei Sekunden auf geänderte Dateien (Zeitstempel und Größe). Das Speichern des POST auf /schluessel/<name> bleibt wie es ist, es gibt keine API dafür.'''

[[block]]
titel = 'Inhalt im Arbeitsspeicher (Etappe 2d)'
text = '''
Der Server liest alle Projekte beim Start einmal (projekt.toml, alles in daten/, dazu data/pc.toml und data/schwerpunkte.toml), prüft sie mit dem Vertrag und hält sie im Arbeitsspeicher, mit einer Versionsnummer (src/inhalt/store.rs, ContentStore). Die Lesewege (/api/projects, /api/projects/<slug>, /api/projekte/<slug>, …/daten/<name>, /api/pc, /api/anstehend, …/stand), der Fristen-Lauf jede Minute und die Backend-Module lesen nur von dort. Sie rechnen mit denselben Funktionen wie vorher, nur nicht mehr bei jeder Anfrage von der Platte. Gemessen an rund zwanzig Projekten (Debug-Bau): Start etwa 0,2 s, jede Anfrage der Startseite wenige Millisekunden.

Der Beobachter gleicht alle zwei Sekunden ab und liest nur das Projekt neu, in dem sich projekt.toml oder etwas in daten/ geändert hat. Die Seite bekommt dann genau ein Ereignis projekt und lädt nur dieses Projekt und die Projektliste neu, nicht mehr alles. Bilder in assets/ ändern den Inhalt nicht. Ändern sich mehr als drei Projekte auf einmal (etwa beim ersten Git-Lauf nach dem Start), kommt ein einziges Ereignis inhalt.

Lässt sich eine Datei gerade nicht lesen (gesperrt, während ein Programm schreibt), bleibt der letzte gute Stand des Projekts stehen; /api/pruefung nennt die Datei, und alle zwei Sekunden wird es wieder versucht. Ein Fehler im Inhalt (falsches Feld, kaputtes TOML) steht dagegen sofort da, wie bisher. Für die Chats ändert sich nichts: Eine gespeicherte Datei ist nach höchstens etwa zwei Sekunden in der API und auf der Seite.

Git: Ob sich in einem Repo etwas getan hat, sieht der Beobachter alle zwei Sekunden an HEAD, index und den Dateien oben im Repo, alle zehn Sekunden auch tiefer (bis 4000 Einträge, ohne node_modules, target, build). Weil der Dienst Ihre Repos meist nicht lesen darf, fragt er dafür den Boten (Anfrage repo_stempel, nur für Repos, die eine Projektseite nennt). Ein älterer Bote kennt sie nicht; dann schaut der Dienst selbst, und für Ihre Repos bleibt es beim Takt von 60 Sekunden. Die Projektkarte zeigt, wie alt der Git-Stand ist, sobald er älter als fünf Minuten ist.'''
