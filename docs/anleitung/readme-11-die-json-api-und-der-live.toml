  ['/api/stand', 'Kopfleiste, Fassung 3: der gemeinsame Stand für die Aktualitätsprüfung im Blatt der Brotkrumen, frei: ereignis (wie viele Ereignisse seit dem Start, nur die Arten, die auch der freie Kanal trägt), inhalt (Version des Inhalts, wie in /api/betrieb) und fassung. /api/stand/voll (geschützt) zählt in ereignis alle Ereignisse mit Daten des geschützten Kanals (ohne pc, anmeldung, bau)'],
  ['/api/betrieb', 'wie der Server läuft: modus (dienst, konsole, umgebung), version, commit (oder null), gestartet, einstellungen (Pfad der dienst.toml oder null), bote (verbunden, getrennt, nicht vorgesehen) und bote_seit (seit wann verbunden, bei getrennt zuletzt gesehen), speicher, ab 2d inhalt (version, Zahl der projekte, geladen_in_ms beim Start, Zahl der lesefehler) und ab A3 sitzung: ob die Sitzungsabfrage für „Bote fehlt“ geht (geht), ob Sie angemeldet sind (inhaber_angemeldet), woher das kommt (quelle: windows, bote für den Bericht des Boten, solange seine Sitzung an der Konsole ist, oder unbekannt, dann ohne Meldung), die Fehlerart (fehler: sid-fehlt, wts, abgebrochen, nur-windows, sieht-inhaber-nicht) und wann gefragt wurde (geprueft); nie SID oder Name. Seit der Kopfleiste, Fassung 2, sind einstellungen, bote_seit und sitzung hier immer null und bote nur vorgesehen oder nicht vorgesehen; sie stehen nur in /api/betrieb/voll (geschützt, sonst gleich). Seit der Kopfleiste, Fassung 2, dazu fassung (Ordner der Oberfläche unter web/builds oder build), fassung_gebaut und ordner (je gelesenem Ordner name und stand: lesbar, fehlt, nicht lesbar; nur kurze Namen). Scheitert die Abfrage, steht einmal je Wechsel eine Warnung im Protokoll'],
  ['/api/anmeldung/probe', 'Probe der Windows-Anmeldung (seit Etappe 7a1): ohne Nachweis 401 mit WWW-Authenticate: Negotiate, nach der Aushandlung 200 mit konto und mechanismus (etwa ntlm), bei fremdem Konto 403 mit Satz'],
  ['/api/anmeldung/wer', 'ob die Windows-Anmeldung hier verfügbar ist: verfuegbar und paket'],
  ['/api/entscheidungen', 'ab 4d, geschützt (Windows-Anmeldung): alle docs/entscheidungen/*.toml, neueste zuerst; je Eintrag nur der Dateiname, die bekannten Felder (datum, thema, status, von, etappe, urteil, was) und alle übrigen unter weitere als Text, Liste oder Gruppe; eine kaputte Datei ist ein Eintrag mit fehler (Satz), nie ein Fehler der Liste; eine Datei ohne Leserecht ebenso. Darf der Server den Ordner nicht lesen (oder scheitert das Lesen anders), ist die Liste leer und warnung trägt einen Satz ohne Pfad (die Seite zeigt ihn als Problem statt „noch keine Entscheidungen“); fehlt der Ordner, ist warnung null'],
  ['/api/zielbild', 'ab 4d, geschützt (Windows-Anmeldung): die Abschnitte aus docs/zielbild/*.toml (titel, reihenfolge, text, punkte, die [[block]] unter bloecke mit genau einem Inhalt text, punkte, tabelle oder beispiel, Sätze „Block n: …“ zu kaputten Blöcken unter hinweise, übrige Felder unter weitere; prüfen mit dashboard.exe pruefe --system docs/zielbild); leer, solange es keine gibt (die Seite zeigt dann einen Platzhalter); warnung wie bei /api/entscheidungen (kein Recht oder Lesefehler: Satz, die Seite zeigt ihn statt des Platzhalters)'],
  ['/api/anleitung', 'ab 6b, geschützt (Windows-Anmeldung) wie /api/zielbild: die Abschnitte aus docs/anleitung/*.toml im Code-Repo, in derselben Form (abschnitte mit titel, reihenfolge, bloecke, hinweise, weitere; prüfen mit dashboard.exe pruefe --system docs/anleitung); ohne Anmeldung 401; warnung wie bei /api/entscheidungen (kein Recht oder Lesefehler: Satz ohne Pfad), fehlt der Ordner, ist die Liste leer'],
