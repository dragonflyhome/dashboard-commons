  ['/api/antworten/<slug>/<id>', 'die neueste Antwort auf diese Frage, auch aus dem Archiv, mit antwort und notiz (null: keine); ohne Antwort 404'],
  ['/api/antworten[?projekt=<slug>]', 'Antworten außerhalb des Archivs, neueste zuerst'],
  ['/api/pruefung', 'Prüfung aller Projekte: Zahl der Projekte, Fehler und Hinweise, dazu je Projekt mit Befunden Slug und Befunde'],
  ['/api/pruefung/<slug>', 'Prüfung eines Projekts (wie dashboard pruefe <slug>); 404, wenn es das Projekt nicht gibt'],
  ['/api/events', 'Live-Kanal (Server-Sent Events), geschützt: seit der Kopfleiste, Fassung 2, als Erstes anmeldung mit stand: angemeldet (dasselbe Ereignis wie auf /api/events/frei); endet eine Sitzung mit Passkey (Widerruf, Abmelden, alle Sitzungen beendet), zum Schluss anmeldung mit nicht_angemeldet, dann endet der Strom; ab 2d projekt (slug, version), wenn der Server ein Projekt neu gelesen hat oder sein Git-Stand neu ist, daten (name, version) bei data/<name>.toml und inhalt (version, projekte, daten) statt vieler einzelner, wenn mehr als drei Projekte auf einmal neu sind; dazu wie bisher change bei geänderten Dateien in projects/ und data/, pc alle 5 Sekunden mit CPU, Speicher, Platte, vorgang bei jedem Schritt eines Vorgangs; bau (slug, zustand laeuft/gruen/rot, meldung, gescheitert) bei jedem Schritt des Baumeisters (ab 4c auch, wenn ein schon rotes Projekt rot bleibt; meldung ist ein fester Satz ohne Pfade und Befehle, den vollen Satz tragen Vorgang und Meldung; gescheitert: der ganze Bau lief nicht durch); change mit Bereich aufgaben (ab 5a) und anstehend (ab A1, auch nach einer Antwort; ab A3 auch bei jeder neuen, hochgezählten, gelesenen oder behobenen Meldung)'],
  ['/api/events/frei', 'freier Kanal (Kopfleiste, Fassung 2), ohne Anmeldung, hinter Adresse, Herkunft und den übrigen Schleusen; nur genau dieser Pfad ist frei. Als Erstes anmeldung (stand: angemeldet, nicht_angemeldet oder nicht_registriert, vom Server bestimmt), dann nur projekt, inhalt, daten (nur pc), pc, fassung und nachholen; alle 15 s der Kommentar lebenszeichen. Nie Vorgänge, Antworten, Aufgaben, Schlüssel, Entscheidungen oder Verlauf (Erlaubnisliste FREIER_KANAL in src/api/events.rs, Wächter-Test)'],
