# Abschnitt „Projekt-Backends (Etappe 4b)“ (Etappe 6b, Format wie docs/zielbild).
titel = 'Projekt-Backends (Etappe 4b)'
reihenfolge = 216

[[block]]
text = 'Ein Projekt darf ein eigenes Backend-Modul in Rust haben. Es läuft im Dienst mit, ohne Trennung; jede Änderung kommt als Merge-Request (Vorgang merge) und geht durch die übliche Prüfung. Wie ein Chat ein Modul schreibt und einreicht, steht im Abschnitt „12. Backend-Module (ab Etappe 4b)“.'

[[block]]
punkte = [
  'Workspace: Cargo.toml ist zugleich der Workspace. Mitglieder sind der Dienst (.), das SDK crates/dashboard-projekt, die Vorlage projects/_vorlage/server und je Projekt mit Modul projects/<slug>/server. Alle stehen auch in default-members, damit cargo test im Repo sie mit prüft. cargo test in projects/<slug>/server/ baut nur das Modul und das SDK.',
  'SDK (crates/dashboard-projekt): Trait Modul (slug(), router(), tabellen(), hooks(), vertrag()), der ProjektKontext (eigene TOML geprüft lesen, eigene Tabellen, Git-Stand nur lesen, jetzt(), Protokoll mit projekt=<slug>), der Rahmen um jeden Router (Absturz je Anfrage gefangen, Körper ≤ 64 KiB, Fehlerform { fehler, art }), der Export der Typen nach web/src/lib/vertrag/projekte/<slug>/ (fest, löscht nichts) und der Pruefstand für Tests ohne Dienst (Feature pruefstand, nur in Tests; ProjektKontext::neu nur mit Feature dienst). Das SDK hängt nicht vom Dienst ab; der Dienst füllt den Kontext über den Trait Anbindung (src/projekte/anbindung.rs).',
  'Register (src/projekte/mod.rs): die Liste module(), je Projekt eine Zeile. Ein Modul wird nur eingehängt, wenn slug() zum Ordner projects/<slug>/server und zur Kiste projekt-<slug> passt. Es hängt jeden Router unter /api/projekte/<slug>/x/ ein, richtet beim Start die Tabellen ein, ruft die Hooks (nach_lesen im Leseweg von /api/projekte/<slug>/daten/<name>, nach_daten_geaendert 2 s nach der letzten Änderung, zeitplan höchstens alle 5 Minuten, taeglich nach der Sicherung, bei_vorgang für eigene Vorgänge, nach_bau), jeden in spawn_blocking mit Zeitlimit (30 s, nach_lesen 5 s) und höchstens einem Lauf je Hook und Projekt. Fehler und Abstürze stehen im Protokoll und als Fund des Projekts in /api/pruefung (wiederholte als „wiederholt“).',
  'Schreibende Wege eines Moduls brauchen die Windows-Anmeldung und die Herkunftsprüfung, wie alle schreibenden Wege; lesende sind frei.',
  'Datenspeicher (Schema 7): Tabellen der Module heißen projekt/<slug>/<name> und entstehen nur über tabellen(). Das Verzeichnis projekt_tabellen hält ihre Fassung. Sie stehen auf /daten, in der Sicherung und im Export. Steigt die Fassung einer Tabelle, wird vor dem Umbau gesichert (dashboard-JJJJ-MM-TT-vor-projekt-<slug>-<name>-<alt>.redb). Passt die Fassung nicht (abgelehnt oder Umbau gescheitert), ist die Tabelle für das Modul gesperrt.',
  'Wächter-Tests (src/projekte/waechter.rs, ein Textscanner gegen Versehen; gegen Absicht schützt die Prüfung des Merge-Requests): jede .rs unter projects/*/server/ mit #![forbid(unsafe_code)], kein std::fs, std::net, std::env, std::process, thread::spawn, static mut, Command, kein tokio::fs, tokio::net, tokio::process, tokio::spawn, spawn_blocking (tokio nur für Tests), include_str! nur aus dem eigenen Ordner, kein include!, nur geprüfte Kisten, kein path in Kistenzielen und nie die Kiste dashboard.',
  'Beispiel: die Vorlage projects/_vorlage/server (Endpunkt GET /api/projekte/<slug>/x/fortschritt, Zeitplan jede Stunde in die Tabelle projekt/<slug>/stand). Rechenteile der Projekte liegen im Inhalt und kommen über die Zusammenbau-Kiste dashboard-lokal hinein (Abschnitt „14. Umzug des Inhalts: Code-Repo und dashboard-inhalt“).',
]
