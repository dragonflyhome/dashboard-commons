# Abschnitt „5. Committen“ (Etappe 6b, Format wie docs/zielbild).
titel = '5. Committen'
reihenfolge = 105

[[block]]
text = '''
Im Dashboard-Repo als Ranke committen (user.name Ranke, user.email ranke2@proton.me, nur ASCII). Commit-Nachrichten ohne Anhänge: kein Co-Authored-By, kein Generated with, keine Namen von KI-Modellen oder ihren Firmen. Der Pre-Push-Prüfer weist solche Commits ab (Abschnitt 14).

Seit Teil 3 der Veröffentlichung folgt jede erste Zeile Conventional Commits 1.0: typ(bereich)!: text. Typen: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert; der Bereich in Klammern und das ! sind freiwillig, nach dem Doppelpunkt genau ein Leerzeichen. Beispiele: fix(web): Knopf reagiert wieder auf Enter, feat!: Tags nur noch v0.x. Ein Bruch steht nur als ! in der ersten Zeile; Fußzeilen gibt es nicht, auch kein BREAKING CHANGE: (das ist ein Anhang). Das gilt auch für Merges: die Standardmeldung Merge branch … geht nicht durch, die Nachricht kommt mit -F (etwa chore(merge): <zweig> nach main). Der Pre-Push-Prüfer prüft die erste Zeile jedes Commits noch einmal, auch was mit --no-verify, cherry-pick oder rebase entstand. Der Hook scripts/hooks/commit-msg prüft das beim Commit mit scripts/Vor-Push.ps1 -Nachricht (dieselben Muster wie beim Push, ohne Namenslisten); Kommentarzeilen (#) und alles ab der Schere von git commit -v schreibt der Hook aus der Nachricht heraus, auch bei -m und -F, wo git sie stehen ließe. git revert und git commit --fixup schreiben keine solche erste Zeile; dort mit -m oder im Editor eine geben (etwa revert: …). Nach squash oder fixup in git rebase -i die Nachricht von Hand zu einer ersten Zeile mit Text darunter zusammenfassen: Eine zweite typ: …-Zeile als letzter Absatz liest git als Anhang, und der Pre-Push weist sie ab.

Jede Änderung mit feat, fix oder ! bekommt eine Zeile unter Unreleased in CHANGELOG.txt, im selben Zweig oder bei einem Beitrag aus einem Fork im eigenen Commit der Betreuer nach dem Merge (Keep a Changelog, Unterabschnitte nur Hinzugefügt, Geändert, Entfernt und Behoben; Veraltetes steht unter Geändert, eine Sicherheitskorrektur unter Behoben, weil der Dienst nur diese vier liest). Tags: nur leicht (git tag ohne -a, -s, -m), nur v0.MINOR.PATCH (etwa v0.1.0), nur auf Commits der First-Parent-Linie von main (Merge-Commits oder der Wurzel-Commit), und nur über scripts/Freigeben.ps1, das dafür scripts/Hochladen.ps1 -Tag aufruft, getrennt vom Push von main (main und Tag zusammen gingen nur mit git push --atomic); der Pre-Push-Prüfer weist alles andere ab (Abschnitt 14).

Versionen (Teil 4, Regel 0.x): Vor 1.0 bleibt die erste Zahl 0. Gezählt werden alle Commits seit dem letzten Tag, auch die eingebrachter Zweige: Hat einer den Typ feat oder ein ! (Bruch), steigt die mittlere Zahl und die letzte wird 0 (0.1.3 wird 0.2.0); sonst steigt die letzte (0.2.0 wird 0.2.1), auch bei nur fix, perf, refactor, docs, chore oder test. Ein revert, der schon Freigegebenes zurücknimmt, ist ein Bruch und trägt das ! (revert!: …). Die erste Zahl steigt nie von selbst. Abwärtskompatibilität gibt es vor 1.0 nicht: Alte Felder, Formen, Wege und Schalter fallen ohne Übergang weg; der Bruch wird im Changelog genannt, nicht gestützt. Ausgenommen ist der Datenspeicher: Bei einer neuen Form wird er weiter umgestellt (Umbauschritte in SCHRITTE, Abschnitt 8), mit Sicherung vorher, nie aufgegeben. Ein Bruch steht in CHANGELOG.txt als eigene Zeile unter Geändert oder Entfernt, die mit „- Bruch: “ beginnt (etwa - Bruch: Schalter -Alt fällt weg, stattdessen -Neu). Das Changelog prüft eine Zählregel: Unreleased ist nicht leer; gibt es ein !, steht unter Geändert oder Entfernt eine Zeile „- Bruch: …“; gibt es ein feat, sind Hinzugefügt oder Geändert nicht leer; gibt es ein fix, ist Behoben nicht leer. Besteht eine Fassung nur aus Pflege (kein feat, fix, perf oder !), genügt unter Geändert die eine Zeile „- Pflege ohne sichtbare Änderung.“. Die Zeilen tragen die Betreuer ein, die den Zweig einbringen. Ein Beitrag aus einem Fork ändert CHANGELOG.txt nicht: Seine Zeilen stehen im Merge-Angebot, die Betreuer tragen sie nach dem Merge in einem eigenen Commit ein (Abschnitt 15, Teil 5); ein fremder Commit, der CHANGELOG.txt ändert, ist ein Fund des Prüfers.'''

[[block]]
text = 'So gibst du frei: scripts/Freigeben.ps1 ohne Schalter im gemeinsamen Arbeitsbaum auf main aufrufen; es prüft alles, schreibt die Fassung fest, lädt main und Tag hoch und startet den Dienst neu, ohne Rückfrage in dieser Folge:'

[[block]]
nummeriert = true
punkte = [
  'Wiederaufnahme: Liegt ein Zweig freigabe/v0.x.y ohne Tag da, Abbruch. Steht main schon auf einem Merge chore(release) mit Tag, geht es bei der Lock-Datei weiter (Punkt 6); ist main noch nicht draußen, laufen vorher die Probe auf den Tag davor (Punkt 2) und die Prüfungen (Punkt 4) noch einmal, denn der Merge kann ohne Freigeben.ps1 entstanden sein; hat sich main danach bewegt, Abbruch vor der Lock-Datei und vor jedem Push. Jeder Satz sagt, was davon schon draußen ist.',
  'Vorbedingungen: git fetch, auf main, sauberer Arbeitsbaum, main enthält origin/main, der letzte Tag auf main liegt auch auf origin, dort auf demselben Commit (sonst fehlte er draußen in der Reihe; das klärt ein Chat von Hand, Freigeben.ps1 holt ihn nicht nach), dashboard-lokal im Inhalt hat keine offenen Änderungen außer an Cargo.lock.',
  'Version und Changelog: Fassung-Festschreiben.ps1 -Pruefen; der künftige Tag ist auch auf origin neu.',
  'Prüfungen: cargo fmt --check, clippy -D warnings, cargo test, npm run verify, dashboard pruefe --system für docs/anleitung und docs/zielbild (0 Fehler, 0 Hinweise), Hochladen.ps1 -Pruefen (mit dem Cache sauberer Blobs; der Hook beim Push in Punkt 7 prüft immer kalt, Abschnitt 14; eine grüne Vorprüfung ist darum keine Freigabe, erst der Hook entscheidet). Freigeben.ps1 und die Skripte des Prüfwegs verlangen PowerShell 7.7.',
  'Festschreiben genau des geprüften Stands von main: Fassung-Festschreiben.ps1 -Basis (hat sich main seitdem bewegt oder steht der Arbeitsbaum nicht mehr auf main, Abbruch mit Rücknahme).',
  'Lock-Datei: im Inhalt dashboard-lokal/Cargo.lock mit cargo update -p dashboard -p dashboard-projekt --offline nachziehen, als eigener Commit nur mit diesem Pfad (sonst scheitert der Bau mit --locked).',
  'Hinaus: Hochladen.ps1 für main, dann Hochladen.ps1 -Tag; was origin schon hat, geht nicht noch einmal.',
  'Dienst: Dienst.ps1 -Neustart, nur wenn der Arbeitsbaum sauber auf main beim Tag steht (der Dienst baut aus ihm); zuletzt der Satz, welche Fassung /api/betrieb meldet, auch wenn der Neustart rot endet.',
]

[[block]]
text = '''Jeder rote Schritt bricht vor jeder Wirkung nach außen ab; was draußen ist, wird nie zurückgenommen, und ein zweiter Aufruf wiederholt nur, was fehlt. Sind main und Tag schon draußen, hält eine offene Lock-Datei den Dienst nicht auf; sie wird nur gemeldet. Kein Schalter überspringt eine Prüfung; Freigeben.ps1 -Pruefen macht nur Vorbedingungen, Version und Prüfungen und nennt die Fassung (steht main schon auf einer fertigen Fassung, sagt es das und was davon draußen ist). Den lokalen Teil macht scripts/Fassung-Festschreiben.ps1; nicht allein aufrufen: Festschreiben geht nur mit -Basis, das Freigeben.ps1 nach allen Prüfungen gibt, allein nur -Pruefen (auf main, sauberer Arbeitsbaum, kein Zweig namens freigabe, weil git sonst freigabe/v0.x.y nicht anlegt; -Pruefen sagt nur, welche Fassung es würde, und was im Changelog fehlt, mit den auslösenden Commits). Es leitet die Version ab, legt in einem vorübergehenden Worktree den Zweig freigabe/v0.x.y mit einem Commit chore(release): v0.x.y an (Unreleased wird <version> - JJJJ-MM-TT, darüber ein neues leeres Unreleased; version in Cargo.toml und Cargo.lock, in web über npm version <v> --no-git-tag-version in package.json und package-lock.json), führt ihn mit git merge --no-ff auf main zusammen, setzt den leichten Tag v0.x.y auf diesen Merge-Commit und löscht den Zweig. Scheitert es vor dem Merge, sind Worktree und Zweig wieder weg und main ist unverändert. Hinaus geht dabei nichts; das Hochladen (scripts/Hochladen.ps1 und -Tag, Abschnitt 14) macht Freigeben.ps1. Der Wächter versionen_gleich_und_changelog_geordnet (tests/vor_push.rs) prüft: die Version in Cargo.toml, Cargo.lock, web/package.json und web/package-lock.json ist gleich, ihre erste Zahl 0; CHANGELOG.txt beginnt nach dem Kopf mit Unreleased; jede weitere Überschrift hat die Form x.y.z - JJJJ-MM-TT, absteigend; die oberste ist genau die Version aus Cargo.toml. Das Changelog liest er mit demselben Leser wie der Dienst (src/fassungen.rs); jeder Hinweis des Lesers (andere Überschrift, unbekannter Unterabschnitt, lose Zeile, Fassung doppelt oder nicht absteigend) ist ein Fehler. Festschreiben bricht bei Veraltet oder Sicherheit unter Unreleased mit einem Satz ab. Der Pre-Push-Prüfer nimmt einen Tag v0.x.y nur, wenn im getaggten Commit Cargo.toml unter [package] genau eine Zeile version mit dieser Version hat und der oberste Abschnitt nach Unreleased in CHANGELOG.txt dieser Fassung gehört, mit gültigem Datum (Abschnitt 14).

Änderungen am Rust-Code bitte mit dem Betreuer des Dashboards absprechen.

Änderungen an src/ und web/ macht nur der Betreuer des Dashboards, und zwar in seinem eigenen Worktree (../dashboard-neu, Testport 8788), nicht im gemeinsamen Arbeitsbaum. Umgekehrt kann ein fremdes Projekt die Tests des Dashboards nicht brechen: cargo test liest nur das feste Beispiel-Repo in tests/beispiel/, nie die echten projects/. Der Beispielbenutzer dort heißt ranke, benannt nach dem Hauptentwickler Ranke.'''

[[block]]
titel = 'Für den Betreuer des Dashboards: der Vertrag aus einer Quelle'
text = 'Typen, die zwischen Server und Oberfläche oder aus den TOML-Dateien der Chats kommen, gibt es nur einmal, in Rust:'

[[block]]
nummeriert = true
punkte = [
  'Neue Typen nur in src/vertrag/ anlegen (API-Antworten in api.rs, Kopf in projekt.rs, Bausteine in daten.rs), mit #[derive(TS)].',
  'Neue Wurzeltypen in src/vertrag/export.rs in die Liste wurzeln! eintragen; was sie enthalten, kommt von selbst mit.',
  'cargo test ausführen. Der erste Lauf schreibt web/src/lib/vertrag/ neu und schlägt fehl, wenn etwas abwich; der zweite ist grün. Die Dateien in web/src/lib/vertrag/ mit einchecken.',
  'Nie von Hand in web/src/lib/vertrag/ schreiben. Die Oberfläche importiert nur aus $vertrag; Typen nur für die Oberfläche bleiben in web/.',
  'Ein neues Pflichtfeld in einer TOML-Datei braucht einen Fehlersatz: ein Beispiel für das fehlende Feld in src/vertrag/lesen.rs (wie bis = "2027-01"), damit die Meldung sagt, wie es richtig geht.',
]

[[block]]
titel = 'Für den Betreuer des Dashboards: Dienst und Bote'
nummeriert = true
punkte = [
  'Eine neue Aufgabe des Boten nur über zwei Stellen: die Anfrage und die Antwort in src/vertrag/bote.rs, die Ausführung in src/bote/aufgaben.rs.',
  'Der Bote gibt nie einen Wert aus dem Tresor zurück, auch nicht in Fehlersätzen oder im Protokoll. Werte auf dem Weg zum Tresor stecken in Wert (wird überschrieben, Debug zeigt nur „verborgen“).',
  'Neue Features von windows-sys nur zentral in Cargo.toml eintragen (eine Liste für Dienst, Pipe, Tresor und SSPI).',
  'Tests nehmen ihre eigene Pipe (dashboard-test-…) und ihre eigene dienst.toml in einem Temp-Ordner, wie tests/bote_pipe.rs und tests/dienst_konsole.rs. Nie die echte Pipe dashboard-bote, nie C:/ProgramData/Dashboard.',
  'Den Testserver (8788) aus einer Kopie der exe starten, nicht direkt aus target/, damit cargo build die Datei nicht blockiert findet.',
  'Nie als Administrator testen. Der Dienstmodus (--dienst) wird nur in Etappe 7a2 am echten Dienst geprüft; bis dahin --konsole --einstellungen.',
  'Lesewege im Server (Etappe 2d) lesen Projekte nur aus dem ContentStore (state.inhalt.bestand()), nie mit seite::load_all oder seite::daten_lesen von der Platte. Was die Seite neu laden muss, sagt der Store mit projekt, daten oder inhalt; ein neues change nur für Dinge, die nicht aus Dateien kommen (Aufgaben, Anstehend). Tests bekommen mit AppState::fuer_tests einen Store, der bei jedem Zugriff abgleicht; für einen anderen Projektordner .mit_projekten(ordner).',
  'Scheitert scripts/Dienst.ps1 -Neustart im Schritt cargo build --release mit „Zugriff verweigert (os error 5)“, hielt meist ein anderes Programm (Virenscanner, Indexdienst, ein Editor) kurz eine Datei in %LOCALAPPDATA%/Dashboard/cache/dienst/release fest. Der Dienst läuft dann unverändert weiter. So geht es weiter: kurz warten, dann scripts/Dienst.ps1 -Neustart noch einmal (kein Bau von Hand: ohne CARGO_TARGET_DIR auf cache/dienst landet er in einem anderen Ordner). Den Platz nicht löschen und kein cargo clean: Der kalte Neubau dauert Minuten und hilft gegen die kurze Sperre nicht.',
]

[[block]]
titel = 'Werkzeuge: immer installiert, vor jedem Commit formatieren'
text = 'Prettier, ESLint, Stylelint, svelte-check, rustfmt und clippy sind immer installiert. Fehlt eines, darf ein Chat es ohne Rückfrage nachinstallieren: die Node-Werkzeuge mit npm install in web/ des Code-Repos (nie npx mit Download), rustfmt und clippy mit rustup component add. Jede andere Installation braucht weiter das Ja des Inhabers. Vor jedem Commit:'

[[block]]
nummeriert = true
punkte = [
  'In web/: npx --no-install prettier --write auf die geänderten Dateien, dann npm run lint (Prettier-Prüfung, ESLint, Stylelint) und npm run check (svelte-check).',
  'Rust: cargo fmt --all (rustfmt.toml: max_width = 160) und cargo clippy --workspace --all-targets -- -D warnings ohne jede Warnung. Ein #[allow(clippy::…)] nur an der einzelnen Stelle mit einem Kommentar fürs Warum, nie für ganze Kisten oder Module. Der Hook prüft beides (cargo fmt --all --check und clippy mit -D warnings), sobald eine .rs-Datei gestagt ist; außer auf main bricht er ab, wenn CARGO_TARGET_DIR fehlt (sonst baute clippy kalt im Worktree). Merges, --no-verify und Toolchain-Wechsel prüft der Hook nicht: nach jedem Merge auf main cargo clippy --workspace --all-targets -- -D warnings. Reine Formatierungs-Commits stehen in .git-blame-ignore-revs (einmal git config blame.ignoreRevsFile .git-blame-ignore-revs).',
  'Der Hook scripts/hooks/pre-commit prüft vor jedem Commit das Prettier-Format der gestagten Dateien unter web/ (und bei gestagten .rs-Dateien, Cargo.toml oder Cargo.lock Rust mit cargo fmt --check und clippy --locked, siehe oben) und ändert nie eine Datei. Ohne solche Dateien endet er sofort; fehlt web/node_modules (im Worktree: Junction auf das des Haupt-Repos), bricht er mit einem Satz ab. Eingehängt wie der Pre-Push-Prüfer mit git config core.hooksPath scripts/hooks. --no-verify nur nach Ja von Architektur oder Inhaber.',
  'pruefe findet die Werkzeuge immer im Code-Repo, auch wenn es aus dem Inhaltsordner läuft: Es nimmt das Repo, aus dem das Programm gebaut wurde. Im Inhaltsordner ist kein eigenes node_modules nötig.',
  'So fällt ein Formatfehler wie in Etappe 6a vor dem Commit auf und nicht erst auf main.',
  'Nach jedem Merge, der Skripte (scripts/*.ps1) ändert, die Tests auf main mit DASHBOARD_TESTS_VOLL=1 laufen lassen: Wächter wie skripte_schatten laufen nur dann.',
  'Zeitgrenzen in Tests (etwa „lesend schnell“) gelten im normalen Lauf streng; nur mit DASHBOARD_TESTS_VOLL=1, wenn alle Tests gleichzeitig laufen, dürfen sie großzügiger sein (dashboard::zeitgrenze, mit einem Kommentar fürs Warum). Ausreißer mit anderer Ursache (Datei belegt, Temp-Datei weg) werden an der Ursache behoben, nie mit längeren Grenzen oder #[ignore].',
]

[[block]]
titel = 'Bauordner warm halten, einmal täglich aufräumen'
text = 'Regeln: Bauordner werden einmal täglich gelöscht, nicht nach jeder Arbeit; wer jedes Mal neu baut, baut immer kalt. Ein Bau gehört in den Anwendungs-Cache von Windows, nicht in die Ordner der Chats. Ablage nach Windows-Standardpfaden: Cache nach %LOCALAPPDATA%/Dashboard/cache, Daten des Dienstes nach %PROGRAMDATA%/Dashboard, eigene Programmdaten nach %APPDATA%, Quellen nach %USERPROFILE%/dev.'

[[block]]
nummeriert = true
punkte = [
  'Rust: ein fester Cache je gleichzeitig bauender Rolle unter %LOCALAPPDATA%/Dashboard/cache/: arbeit-1 und arbeit-2 (Arbeiter und Prüfläufe des Betreuers des Dashboards), abnahme (Architektur), dienst (nur scripts/Dienst.ps1 -Neustart). Jeder Lauf setzt CARGO_TARGET_DIR auf seinen Platz und nur auf ihn: Zwei Bauten im selben Ordner kollidieren (eine laufende Test-Exe lässt sich nicht neu linken, „Permission denied“), und Zweige überschreiben sich gegenseitig die Kiste dashboard. Nie dev/dashboard/target: Den nutzt nur main für eigene Aufrufe wie pruefe (target/release veraltet, wenn dort niemand baut; npm run pruefe nimmt die neueste Fassung, auch die aus cache/dienst). Der Dienst kommt aus cache/dienst (release, mit Zusammenbau release/zusammenbau) und nie von einem Zweig; Dienst.ps1 setzt CARGO_TARGET_DIR nur für seine cargo-Aufrufe und stellt danach den vorigen Wert wieder her. Nach der täglichen Bereinigung baut das erste Einspielen kalt und dauert entsprechend länger; für den Bau hat Dienst.ps1 keine Frist, und der Dienst läuft währenddessen weiter (die 60 s gelten erst nach dem Austausch). Edge-Proben (tests/skripte/*-edge.mjs) nehmen ohne --exe target/debug des Repos: die eingespielte Fassung mit --exe %LOCALAPPDATA%/Dashboard/cache/dienst/release/dashboard.exe (mit Zusammenbau release/zusammenbau/dashboard.exe), einen Zweig mit --exe auf seinen Platz (etwa cache/arbeit-1/debug/dashboard.exe).',
  'Die Arbeitsordner der Assistenten (im Temp-Ordner) enthalten nur Quellen und kleine Zwischenergebnisse, keine Bauordner. Sie bleiben klein.',
  'Node: web/node_modules im Worktree ist immer eine Junction auf das node_modules des Haupt-Repos, nie eine Kopie; am Ende nur den Link entfernen. Vite- und ESLint-Cache liegen heute in node_modules/.vite und node_modules/.cache und werden über die Junction geteilt; der Umzug nach %LOCALAPPDATA%/Dashboard/cache/<werkzeug> ist eine Code-Änderung (vite cacheDir, --cache-location, ESLINT_CACHE) und kommt in einem eigenen Zweig.',
  'Aufräumen einmal täglich (geplante Aufgabe, scripts/Bauordner-Bereinigen.ps1): Das Skript verlangt -Wurzel, den Arbeitsordner der Assistenten (darin je Projekt ein Ordner mit einem Unterordner je Sitzung; geräumt wird nur in dessen Arbeitsbereich, dem Unterordner scratchpad); eine -Wurzel, die das Benutzerprofil, %APPDATA% oder %LOCALAPPDATA% ist oder umfasst, lehnt es als zu breit ab. Mit -Scharf ist auch -Tabu Pflicht (die Ordner, die nie angefasst werden). Wurzel und Tabu stehen nur in der geplanten Aufgabe, nicht im Code; ein Probelauf geht über -Selbsttest oder gegen eine Testwurzel. Jeder Cache-Platz mit CACHEDIR.TAG unter %LOCALAPPDATA%/Dashboard/cache wird ganz geleert, wenn gerade kein cargo und kein rustc läuft (innerhalb des Tages bleibt er warm, der erste Bau am Tag ist kalt). Liegt darin EINSPIELEN.lock (Dienst.ps1 -Neustart legt sie vor dem ersten cargo-Aufruf an, mit Zeit und Prozess-ID, und entfernt sie, sobald die Programme in bin liegen oder nichts eingespielt wurde), bleibt der Platz; ist sie älter als ein Tag, gilt sie als verwaist, und der Platz wird geleert (eine Zeile im Protokoll). Dazu Rust-Bauordner in den Arbeitsordnern der Sitzungen, in die seit einem Tag nichts geschrieben wurde, und in Sitzungen, die nicht laufen, Kopien von node_modules (nie Links), .vite, .eslintcache und *.tmp, die seit einem Tag unverändert sind. Ohne -Scharf nur ein Trockenlauf. Bauten in web/builds räumt der Bote selbst auf. Nie dev/dashboard/target/release, nie den Bauordner eines laufenden Baus.',
  'Verläufe und Daten der Assistenten werden nie gelöscht, von keiner Routine; das Skript nimmt ihre Ordner mit -Tabu aus.',
]

[[block]]
titel = 'Für den Betreuer des Dashboards: Token und Stil-Prüfung'
text = 'Alle Farben, Schatten und Schriften stehen als Token in web/src/app.css (:root, darunter das dunkle Thema). Nur dort stehen feste Werte; überall sonst nur var(--…).'

[[block]]
[block.tabelle]
spalten = ['Gruppe', 'Token']
zeilen = [
  ['Flächen und Text', '--bg, --card, --text, --muted, --line, --papier (weiß in beiden Themen, für Bilder und die Vorschau), --code-bg, --overlay'],
  ['Akzent', '--accent, --accent-soft, --on-accent (Text auf --accent), --accent-text (Akzent als Text auf --accent-soft), --fokus'],
  ['Bedeutung als Ton (Punkte, Balken, Ringe)', '--ok, --warn, --bad, --info, --done, --plan; --on-warn für Text auf --warn'],
  ['Bedeutung als Text', '--ok-text, --warn-text, --bad-text, --info-text (nie --ok usw. als Textfarbe)'],
  ['Bedeutung als Fläche', '--ok-soft, --warn-soft, --bad-soft, --info-soft, --done-soft, --plan-soft (ab 3a-3); über die Klasse b-… als --ton-soft'],
  ['Reihen (Anteile, Konfetti)', '--reihe-1 bis --reihe-10, im Code über reihe(n) aus #lib/reihen.ts'],
  ['Schatten und Ringe', '--shadow, --shadow-hover, --shadow-gross, --shadow-bild, --ring-akzent, --ring-hof, --puls, --puls-weit'],
  ['Schrift', '--font, --mono; Größen --text-2xs (0,75rem), --text-xs, --text-sm, --text-md, --text-base (1rem), --text-lg, --text-xl, --text-2xl … --text-5xl (2rem), --text-h1, --text-riesig, --text-em-lg/--text-em-md/--text-em-sm (relativ), --text-grafik/--text-grafik-klein (SVG)'],
]

[[block]]
text = 'So geht es:'

[[block]]
nummeriert = true
punkte = [
  'Farbe mischen ist erlaubt, wenn alles Token sind: color-mix(in srgb, var(--accent) 22%, transparent). Daneben gelten nur transparent, inherit und currentColor, dazu none für box-shadow, fill und stroke. Nicht initial oder unset: color: initial gibt im dunklen Thema schwarzen Text.',
  'Bedeutungen (ok, laeuft, wartet, problem, info, neutral) bekommen ihre Klasse nur von klasse() aus #lib/bedeutung.ts (b-ok, b-laeuft, …). Die Klasse setzt --ton; wer malt, schreibt background: var(--ton, var(--plan)) oder stroke: var(--ton, …). Seit 3a-3 setzt sie dazu --ton-soft, die ruhige Fläche derselben Bedeutung (background: var(--ton-soft), Text darauf bleibt --text; so Hinweis und die Widgets). Die alten Klassen st-…, c-…, ton-… und ampel-… gibt es nicht mehr.',
  'Fehlt ein Token, kommt es in app.css dazu, hell und, wo nötig, im dunklen Block. Danach npm run test: web/src/kontrast.spec.ts liest app.css und verlangt für Text 4,5:1 und für Punkte, Balken und Fokusrahmen 3:1, in beiden Themen. Ein neues wichtiges Paar dort in PAARE eintragen. Die Reihen und --warn/--warn-text stehen in OFFEN mit ihrem gemessenen Wert auf zwei Stellen und der Schwelle; in 3a+ hat Architektur fünf Werte angehoben, der Spielraum ist klein (3,10:1). Ein Token-Wert ändert sich nur nach Entscheidung von Architektur, mit altem und neuem Verhältnis in beiden Themen.',
  'Geprüft wird in npm run lint (und damit in npm run verify): Stylelint (web/stylelint.config.js) für alle Stile in *.css und <style> (keine Hex-Werte, keine Farbfunktionen wie rgb(), hsl(), color() oder device-cmyk(), auch nicht groß geschrieben, keine Farbnamen; Farben, Schatten, Schriftart und -größe, auch in der Kurzform font, nur als Token; kein @import, kein url(http…) oder url(//…), kein :global, kein !important). Die Kurzform font nur als font: inherit oder mit einem Token (font: var(--…)); alles andere als Einzeleigenschaften (font-size: var(--text-sm); font-weight: 600;). In *.svelte liest Stylelint (über postcss-html) auch die Attribute style="…" und wendet dieselben Regeln an; ein {wert} darin gilt als freier Wert und fällt durch (Werte darum als style:--name={…}). web/src/farben.spec.ts prüft dazu, was Stylelint nicht sieht: style:…, fill=, stroke= und Zeichenketten in Svelte und TypeScript (und style="…" noch einmal).',
  'Abschalten nur mit Begründung in derselben Zeile: /* stylelint-disable-next-line regel -- warum */. Ohne Begründung meldet Stylelint einen Fehler. Jede Abschaltung steht in der Liste unter „Erlaubte Abschaltungen“ (gleich unten).',
  'Eine Regel für px gibt es noch nicht; sie kommt, wenn die Abstands-Token vollständig sind.',
  "Hell und dunkel (ab 3b): Ohne Wahl folgt das Thema dem System. Der Schalter „Farben“ unten auf jeder Seite (#lib/thema.ts, je Browser in localStorage) setzt data-theme=\"hell\" oder \"dunkel\" am <html>; dafür hat app.css den Block :root[data-theme='dunkel'] mit denselben Werten wie der Block für das dunkle System. Ein neuer dunkler Wert kommt in beide Blöcke; kontrast.spec.ts verlangt Gleichheit und prüft alle vier Fälle. Ein Kasten mit data-thema-vorschau=\"hell\" oder \"dunkel\" zeigt sein Thema fest, egal welches gilt (Logo-Entwürfe). Das kleine Skript im head von app.html setzt die Wahl vor dem ersten Bild; die CSP erlaubt es über seine Prüfsumme, die der Server aus index.html rechnet. Wer es ändert, trägt die neue Prüfsumme im Test thema_skript_der_vorlage (src/sicherheit.rs) ein; die Fehlermeldung nennt sie.",
  'Schriftgrößen relativ zum umgebenden Text (ab 3b auch für Projektseiten): --text-em-sm (0,85em), --text-em-md (0,9em), --text-em-lg (1,05em). Eine Projektseite schreibt also font-size: var(--text-em-lg); statt 1.05em.',
]

[[block]]
titel = 'Für den Betreuer des Dashboards: erlaubte Abschaltungen (ab 3b)'
text = 'Wer in web/src eine Prüfung abschaltet, schreibt den Grund in dieselbe Zeile und trägt die Stelle in die Liste unten ein. Der Test web/src/abschaltungen.spec.ts (läuft in npm run test) sucht in ganz web/src nach Kommentaren mit eslint-disable…, stylelint-disable…, svelte-ignore, @ts-expect-error, @ts-ignore, @ts-nocheck und eslint mit Regel-Einstellung und scheitert, wenn'

