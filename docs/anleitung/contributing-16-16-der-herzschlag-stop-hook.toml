# Abschnitt „16. Der Herzschlag: ein Chat hört nicht auf, solange er Arbeit hat“ (Format wie docs/zielbild).
titel = '16. Der Herzschlag: ein Chat hört nicht auf, solange er Arbeit hat'
reihenfolge = 116

[[block]]
text = '''
Ein Chat, der seinen Zug beendet, obwohl ihm im Dashboard noch ein laufender Schritt gehört, lässt die Arbeit liegen, bis jemand nachfragt. Der Herzschlag ist ein Stop-Hook, der das verhindert: dashboard.exe herzschlag. Der Chat-Client ruft ihn bei jedem Stop auf, mit der Eingabe des Hooks (JSON) auf stdin. Der Unterbefehl fragt das Dashboard auf dem eigenen Rechner, ob der Chat dieser Sitzung noch offene Arbeit hat, und hält den Stop an, solange das so ist.

Die Eintragung des Hooks in die Einstellungen des Chat-Clients übernimmt später ein Skript; von Hand trägt man ihn nicht ein.'''

[[block]]
titel = '1. Woher das Dashboard die Sitzung kennt'
text = 'Der Chat-Client gibt jedem Werkzeugaufruf die Kennung seiner Sitzung in einer Umgebungsvariablen mit. Unter derselben Kennung führt er das Transkript der Sitzung, und als session_id steht sie in der Eingabe des Stop-Hooks; diese letzte Gleichheit ist eine Annahme, die vor dem Eintragen des Hooks am echten Client zu prüfen ist. Stimmt sie nicht, findet die Abfrage nie eine Zuordnung, und jeder Stop geht still durch. scripts\Api.ps1 liest sie und schickt sie als Kopfzeile X-Dashboard-Sitzung mit jeder Anfrage. Gelingt ein schreibender Aufruf (POST mit Antwort 2xx) mit "von": "chat:<name>" im Körper, merkt sich der Dienst: diese Sitzung ist dieser Chat, aber nur, wenn die Anfrage als Inhaber angemeldet ist. Der letzte Stand gilt; darum schreibt eine Sitzung nur mit ihrem eigenen von. Unteragenten erben die Kennung ihrer Sitzung und schreiben deshalb mit dem von ihres Auftraggebers. Die Zuordnung liegt nur im Arbeitsspeicher des Dienstes; nach einem Neustart ist jede Sitzung unbekannt, bis ihr Chat wieder schreibt. Darum rufen Chats die API nur über scripts\Api.ps1 auf, nie mit einem eigenen Aufruf ohne die Kopfzeile.'

[[block]]
titel = '2. Was als offene Arbeit zählt'
text = 'GET /api/sitzungen/<id>/offen (geschützt wie /api/arbeiten, nur für das Konto des Inhabers) antwortet mit der Sitzung, dem Chat (von, null für eine unbekannte Sitzung) und der Liste offen. Offen ist für einen Chat:'

[[block]]
punkte = [
  'ein Schritt mit stand laeuft, der ihm gehört (oder eine laufende Arbeit ohne Schritte, deren besitzer er ist);',
  'ein Schritt, der ihm angeboten ist (angeboten_an), solange er läuft oder als nächstes dran ist.',
]

[[block]]
text = 'Ein wartender Schritt (stand wartet, wartet_auf gesetzt) hält nicht auf, ebenso wenig ein fertiger oder einer, den der Chat einem anderen angeboten hat.'

[[block]]
titel = '3. Wie der Unterbefehl entscheidet'
punkte = [
  'Unbekannte Sitzung, kein Chat zugeordnet oder nichts offen: Exit 0, der Stop geht durch.',
  'Offene Arbeit: Exit 2, der Grund mit den offenen Schritten steht auf stderr; der Chat arbeitet weiter. Ist ein Schritt fertig, setzt er ihn auf fertig; wartet er, trägt er stand wartet mit wartet_auf ein; gibt er ihn ab, bietet er ihn an oder gibt ihn frei.',
  'Höchstens drei Blocks je echtem Nutzer-Zug. Beim vierten Stop im selben Zug geht der Stop mit einer Warnung durch (Exit 0, {"systemMessage": …} auf stdout); die Arbeit bleibt offen. Das ist der Schutz gegen eine Schleife, wenn ein Schritt nie eingetragen wird.',
  'Ist der Stop schon ein zweiter Anlauf (stop_hook_active), liest der Unterbefehl nach 1 s einmal nach: Transkript und Dashboard. Ist die Arbeit inzwischen eingetragen, geht der Stop durch. Ein solcher zweiter Anlauf setzt den Zähler nie zurück, auch wenn das Transkript einen neuen Nutzer-Zug zu zeigen scheint; so hält die Grenze von drei Blocks unabhängig davon, wie der Client die Rückmeldung des Blocks ins Transkript schreibt. Mit Nachlesen dauert ein Stop im schlechtesten Fall etwa 11 s (zwei Abfragen zu je höchstens 5 s und 1 s Pause); der Zeitrahmen des Hooks muss darüber liegen.',
  'Jeder Fehler lässt den Stop durch (Exit 0 ohne Ausgabe): keine Verbindung, Antwort 401 oder ein anderer Code, Zeitüberschreitung (die ganze Abfrage hat höchstens 5 s), unlesbare Antwort, kaputte oder fremde Eingabe auf stdin, ein falscher Aufruf. Ein Fehler hält nie einen Chat fest.',
]

[[block]]
titel = '4. Aufruf und Dateien'
text = 'Gefragt wird mit der Windows-Anmeldung des aufrufenden Kontos, nur auf dem eigenen Rechner; der Schalter --server 127.0.0.1:<port> wählt einen anderen Port (Standard 8787). Die Zähler je Sitzung und ein Protokoll der Fehler (herzschlag.log, nur die Art des Fehlers) liegen unter %LOCALAPPDATA%\Dashboard\herzschlag. Die Sitzungskennung wird für Dateinamen gefaltet: alles außer Buchstaben, Ziffern, - und _ wird -.'

[[block]]
beispiel = '''
dashboard.exe herzschlag
dashboard.exe herzschlag --server 127.0.0.1:8788'''

