# Abschnitt „14. Umzug des Inhalts: Code-Repo und dashboard-inhalt“ (Etappe 6b, Format wie docs/zielbild).
titel = '14. Umzug des Inhalts: Code-Repo und dashboard-inhalt'
reihenfolge = 114

[[block]]
text = 'Entscheidungen: github-trennung (mit [docs_oeffentlich]) und inhaltsquellen ([zusammenbau], [code_nur_kern], [dateien_im_projekt]). Sie liegen im Inhalt (docs/entscheidungen).'

[[block]]
titel = 'Was wo liegt'
[block.tabelle]
spalten = ['Code-Repo %USERPROFILE%/dev/dashboard (kommt einmal auf GitHub)', 'Inhalt %USERPROFILE%/dev/dashboard-inhalt (nur PC und eigene Sicherung)']
zeilen = [
  ['src/, crates/, web/ (ohne Bauordner), tests/ mit erfundenen Beispielen, scripts/, vorlagen/', 'projects/<slug>/ aller Projekte, mit Seiten, Daten, Assets und Rechenteilen (server/)'],
  ['projects/_vorlage/ (Vorlage ohne Inhalt)', 'data/ (pc.toml, schluessel.toml, schwerpunkte.toml, inventar-ausschluss.toml)'],
  ['docs/zielbild/, docs/anleitung/', 'docs/entscheidungen/'],
  ['vorlagen/dashboard-lokal/ (Vorlage der Zusammenbau-Kiste)', 'dashboard-lokal/ (die Zusammenbau-Kiste mit kisten.toml)'],
  ['', 'pruefer/namen.toml (Namenslisten des Pre-Push-Prüfers), UMZUG.txt'],
]

[[block]]
text = 'Das Code-Repo nennt kein Projekt. projects/ darin enthält nach dem Umzug nur _vorlage; der Test tests/inhalt_getrennt.rs und der Pre-Push-Prüfer weisen jeden anderen Inhalt dort ab.'

[[block]]
titel = 'Für alle Chats: wo ihr committet'
punkte = [
  'Euer Projektordner ist %USERPROFILE%/dev/dashboard-inhalt/projects/<slug>/ (statt …/dashboard/projects/<slug>/). Dort arbeitet ihr wie bisher.',
  'Committet wird im Repo dashboard-inhalt, mit denselben Regeln: als Ranke (user.name Ranke, user.email ranke2@proton.me), nur der eigene Ordner, die Nachricht aus einer Datei, Zweige nur mit Merge-Commit (git merge --no-ff), nie git add -A, git stash, git reset oder ein Zweigwechsel im gemeinsamen Arbeitsbaum:',
]

[[block]]
beispiel = '''
git -C %USERPROFILE%/dev/dashboard-inhalt add projects/<slug>
git -C %USERPROFILE%/dev/dashboard-inhalt commit -F <nachricht.txt> -- projects/<slug>'''

[[block]]
punkte = [
  'Die Entscheidungen schreibt die Architektur-Rolle nach dashboard-inhalt/docs/entscheidungen/; data/ liegt ebenfalls im Inhalt.',
  'dashboard.exe pruefe <slug>, die API (scripts/Api.ps1), Warten.ps1 und Schluessel-Lesen.ps1 bleiben im Code-Repo und gehen wie bisher; pruefe findet die Projekte über DASHBOARD_PROJECTS_DIR (Dienst.ps1 setzt es aus den Einstellungen).',
  'Ins Code-Repo kommt kein Projektname, kein Benutzerpfad, keine Adresse. Ein Rechenteil (server/) wird nur nach Prüfung und Entscheidung der Architektur-Rolle in dashboard-lokal/kisten.toml aufgenommen (unten).',
]

[[block]]
titel = 'Einstellungen: [inhalt] in dienst.toml'
beispiel = '''
[inhalt]
projekte = ["C:/Users/<name>/dev/dashboard-inhalt/projects"]   # Liste der Inhaltsquellen
daten = "C:/Users/<name>/dev/dashboard-inhalt/data"
entscheidungen = "C:/Users/<name>/dev/dashboard-inhalt/docs/entscheidungen"'''

[[block]]
punkte = [
  'Ohne den Abschnitt gilt alles wie vorher im Repo. DASHBOARD_PROJECTS_DIR (Liste mit ;) ersetzt weiter die Liste der Quellen, für Dienst, Konsole, Bote und pruefe.',
  '/api/betrieb/voll nennt im Feld quellen, ob [inhalt] gesetzt ist und woraus der Server liest (Quellen, Daten, Entscheidungen); damit hat der Umzug geprüft, dass der Dienst schon aus dem Inhalt liest.',
  'Der Reiter „Hallo“ nennt kein Projekt im Code: /api/hallo sagt, welches Projekt daten/eigen-hallo.toml trägt (das erste nach Slug).',
  '/api/entscheidungen liest aus entscheidungen, /api/zielbild weiter aus <repo>/docs/zielbild. Prüfung, Meldungen, Git-Zwischenspeicher, Bote (Git-Stand, Fingerabdrücke, Bau), pruefe --alle und die Lese-Prüfung beim Start kennen alle Quellen.',
  'Ohne Einstellungsdatei (cargo run): Entscheidungen aus DASHBOARD_ENTSCHEIDUNGEN_DIR, sonst docs/entscheidungen neben dem ersten Projektordner. Die Edge-Proben kopieren den Inhalt aus DASHBOARD_INHALT, sonst aus dashboard-inhalt neben dem Repo, sonst aus dem Repo. Liegt ein Worktree nicht neben dashboard-inhalt (etwa im Temp-Ordner), vor den Proben DASHBOARD_INHALT setzen, sonst sind live und pruefer rot („keine eingecheckten Dateien“). Die Projektseiten der Oberfläche kommen aus web/src/lib/projekte.generated.ts: vor npm run build für die Proben einmal dashboard.exe pruefe --bauliste mit DASHBOARD_PROJECTS_DIR auf <inhalt>/projects, sonst fehlen die Projektseiten.',
]

[[block]]
titel = 'Zusammenbau-Kiste dashboard-lokal'
text = 'Die Bibliothek hat genau eine Anmeldestelle: dashboard::starten(module). Das allgemeine dashboard.exe des Code-Repos läuft ohne Module (die Seiten gehen, die Rechenteile fehlen; die Prüfung sagt das je Projekt mit einem Satz). Die Fassung mit Rechenteilen baut dashboard-inhalt/dashboard-lokal (Vorlage vorlagen/dashboard-lokal):'

[[block]]
punkte = [
  'kisten.toml: je geprüfte Kiste name, pfad (../projects/<slug>/server), typ (der Typ mit impl Modul) und commit (der geprüfte Stand im Inhalts-Repo). [code].pfad zeigt auf das Code-Repo daneben.',
  'Cargo.toml: die Bibliothek des Code-Repos und genau die Kisten der Liste als path-Abhängigkeit; src/lib.rs: je Kiste eine Zeile dashboard::eintrag(<kiste>::<typ>); src/main.rs ruft dashboard::starten.',
  'Der Wächter liegt im Code-Repo, nicht im bewachten Ordner: dashboard.exe pruefe-zusammenbau <ordner> --code <code-repo> [--ohne-lock] (src/projekte/zusammenbau.rs). Er liest nur Dateien und fragt git; er baut nie und ruft cargo nie auf. Er läuft vor jedem cargo-Aufruf in dashboard-lokal, damit weder Bauskripte noch proc-macros laufen, bevor er grün ist; danach baut cargo nur mit --locked. Er verlangt:',
  '– [code].pfad relativ und genau das Code-Repo (Schritt für Schritt und aufgelöst); kisten.toml streng (name projekt-<slug>, pfad genau ../projects/<slug>/server, typ ein Rust-Typname, commit);',
  '– den Ordner Byte für Byte wie vorlagen/dashboard-lokal (Zeilenenden gleich behandelt), bis auf kisten.toml, Cargo.lock und je Kiste eine Zeile in Cargo.toml und src/lib.rs; keine weitere Datei (kein build.rs, keine eigene .cargo-Einstellung), keine Verknüpfung, [workspace] leer;',
  '– in Cargo.lock nur crates.io, jede Kiste mit derselben Fassung und Prüfsumme wie in Cargo.lock des Code-Repos; aus Pfaden nur die Bibliothek, das SDK, dashboard-lokal und die Kisten der Liste;',
  '– im Inhalt (dashboard-lokal und der Ordner darüber) gar kein .cargo; darüber bis zur Laufwerkswurzel und in CARGO_HOME nur dlltool (Name, aktive Toolchain oder <CARGO_HOME>/bin), [net], [http], [term]; kein rust-toolchain darüber, keine Übersteuerung von rustup für den Ordner; keine Umgebungsvariable, die ändert, womit cargo baut (RUSTC_WRAPPER, RUSTFLAGS, CARGO_BUILD_* …);',
  '– keine Git-Einstellung auf irgendeiner Ebene außer der des Systems (git config --list --show-origin --show-scope, auch worktree und eingebundene Dateien), die beim Prüfen ein Programm starten könnte (filter.*, diff.*.command/textconv, core.fsmonitor, core.hooksPath, include*, core.attributesFile), kein Attribut filter an den Dateien einer Kiste und kein Submodul (gitlink, Modus 160000) darin; sonst bricht er sofort ab, ohne weiteren git-Aufruf (kein git diff, kein git status);',
  '– jeden eigenen git-Aufruf ruft er mit --no-optional-locks, core.hooksPath auf einen frischen, leeren Ordner außerhalb des Inhalts (kein Hook aus .git/hooks, etwa post-index-change), ohne Transport (protocol.allow=never), mit GIT_NO_LAZY_FETCH=1 (ein partial clone lädt nichts nach) und ohne die übrigen GIT_*; git diff und git status mit --ignore-submodules=all;',
  '– je Kiste die Wächter-Regeln des Code-Repos (kein build.rs, kein proc-macro, kein [patch], der Weg zum SDK genau zu diesem Code-Repo), im Git-Repo des Inhalts (kein .git darin, weder Ordner noch Datei, auch nicht tiefer) und seit ihrem commit unverändert, auch ohne neue oder von git ignorierte Dateien (git status --ignored). Gegentests: tests/zusammenbau.rs (cargo test im Code-Repo).',
  'Eine Kiste nimmt man so auf (nach Prüfung und Entscheidung der Architektur-Rolle): die drei Zeilen eintragen (kisten.toml mit dem geprüften Commit, Cargo.toml, src/lib.rs); dann der Wächter des Dienstes, %LOCALAPPDATA%/Dashboard/cache/dienst/release/dashboard.exe (dieselbe Fassung wie beim Einspielen; fehlt er nach der täglichen Bereinigung, erst scripts/Dienst.ps1 -Neustart), pruefe-zusammenbau <ordner> --code <code-repo> --ohne-lock, im Ordner cargo --config <code-repo>/.cargo/config.toml update --workspace --offline (schreibt nur Cargo.lock, baut nichts), den Wächter noch einmal ohne --ohne-lock, dann committen. tests/vertrag.rs (kein Wächter) schreibt die Typen nach web/src/lib/vertrag/projekte/<slug>/ im Code-Repo, dort nicht eingecheckt; erst nach grünem Wächter laufen lassen. Ändert sich eine Kiste, ist der Wächter rot, bis der neue Stand geprüft und sein Commit eingetragen ist.',
  'Der Weg einer Kiste zum SDK zeigt auf das Code-Repo daneben, etwa dashboard-projekt = { path = "../../../../dashboard/crates/dashboard-projekt" }; ein gleichnamiger Ordner anderswo (auch im Inhalt) zählt nicht.',
  'scripts/Dienst.ps1 -Neustart baut das Code-Repo (cargo build --release --locked, Bauordner %LOCALAPPDATA%/Dashboard/cache/dienst), ruft dann den Wächter und baut die Kiste nur, wenn er grün ist (cargo --config <code-repo>/.cargo/config.toml build --release --locked, derselbe Bauordner); dann spielt es dashboard-lokal.exe als dashboard.exe ein. Ist er rot (oder fehlt dashboard.exe mit dem Wächter; ebenso in Inhalt-Umziehen.ps1), läuft der alte Dienst weiter. Fehlt die Kiste, läuft das allgemeine dashboard.exe mit einem Satz dazu. Die Folge steht in scripts/Fassung-Bauen.ps1 (dieselbe Datei nutzt die Probe an einer Wegwerf-Kopie).',
  'Fällt eine Kiste aus dem Code-Repo (etwa die Markdown-Kiste mit Etappe 6a), die Cargo.lock der Zusammenbau-Kiste im Inhalt offline mitziehen: in dashboard-lokal cargo tree --offline mit CARGO_TARGET_DIR auf target des Code-Repos und --config <code-repo>/.cargo/config.toml; dabei fallen nur Einträge weg. Sonst meldet der Wächter beim Neustart „… nutzt das Code-Repo nicht mehr“, und der Dienst läuft unverändert weiter.',
  'Wovor der Wächter schützt (Bedrohungsmodell): vor einer Kiste oder Einstellung im Inhalt, die beim Prüfen oder Bauen fremden Code liefe (Bauskript, proc-macro, fremde Quelle, Einstellung von cargo oder git). Nicht vor jemandem mit den Rechten des Inhabers, der die Skripte des Code-Repos oder seine eigenen globalen Einstellungen ändert. Bewusst offen bleibt der kleine Spalt zwischen Prüfung und Bau: scripts/Fassung-Bauen.ps1 baut gleich nach dem grünen Wächter im selben Ordner, ohne Schreibstopp und ohne Schnappschuss. Ändert ein Chat genau dazwischen eine Kiste, baut cargo diesen ungeprüften Stand. Ein Bau aus einem Schnappschuss der geprüften Commits ist geplant, aber noch nicht gebaut.',
]

[[block]]
titel = 'Bauen mit der GNU-Toolchain (llvm-dlltool)'
text = '.cargo/config.toml im Code-Repo nennt nur den Namen llvm-dlltool.exe; dashboard-lokal hat keine eigene Datei: Der Bau dort bekommt sie mit cargo --config <code-repo>/.cargo/config.toml, und im Inhalt ist keine .cargo-Einstellung erlaubt (der Wächter weist sie ab). In den Ordnern über dem Inhalt und in CARGO_HOME darf dlltool nur als Name, als Pfad in der aktiven rustup-Toolchain oder als <CARGO_HOME>/bin/llvm-dlltool.exe stehen. rustc findet den Namen über PATH (%USERPROFILE%/.cargo/bin). Wer ihn nicht auf PATH hat, trägt den vollen Pfad in die eigene Einstellung von cargo ein (%USERPROFILE%/.cargo/config.toml):'

[[block]]
beispiel = '''
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "dlltool=C:/Users/<name>/.cargo/bin/llvm-dlltool.exe"]'''

[[block]]
titel = 'Inventar: Ausschlussliste im Inhalt'
text = 'Welche Ordner das Inventar nie betritt, steht in dashboard-inhalt/data/inventar-ausschluss.toml (nie_betreten = ["…"]), nie im Code. Fehlt die Liste, ist sie leer oder kaputt, wird der Benutzerordner gar nicht durchlaufen; die PC-Seite zeigt nur Laufwerke und Größen und einen Satz (geschlossen scheitern), dazu wo die Liste hingehört. Der Umzug hat die Liste aus dem früheren Stand von src/pc/inventory.rs übernommen.'

[[block]]
titel = 'Der Umzug: erledigt'
text = 'Erledigt. Der Inhalt liegt seitdem in dashboard-inhalt, der Dienst liest ihn über [inhalt] in dienst.toml, und projects/ im Code-Repo enthält nur noch _vorlage. Was damals geschah, steht in UMZUG.txt im Inhalt. Heute ist dafür nichts mehr zu tun; es gilt, was oben steht.'

[[block]]
titel = 'Der Weg nach GitHub (erst nach der Freigabe des Inhabers)'
punkte = [
  'Pre-Push-Prüfer scripts/Vor-Push.ps1, eingehängt mit git config core.hooksPath scripts/hooks (Hook scripts/hooks/pre-push). Er weist ab, was hinaus nicht darf (Kopf des Skripts), und nennt je Fund Datei, Zeile und Muster, nie den Wert. Ohne Namenslisten, mit leeren oder kaputten Listen und bei eigenen Fehlern geht nichts hinaus (Exit 2). Er prüft jedes Paar (Pfad, Blob) mit echtem Modus, das ein neuer Commit des Push-Bereichs hinzufügt oder ändert (git log --raw -m --root --no-renames <alt>..<neu>), nicht nur die Spitze: auch einen Pfad aus einem Zwischenstand, dessen Datei danach unverändert verschoben wurde, und Verknüpfungen und Gitlinks. Beim ersten Push mit neuer Wurzel (alt = 0000…) die ganze erreichbare Geschichte. Ein PNG, ICO oder WebP mit kaputter Struktur (abgeschnittene Stücke, kein sauberes Ende an IEND, RIFF-Länge passt nicht zum Ende) ist ein Fund. Gegentests: tests/vor_push.rs. Der Prüfer läuft unter PowerShell 7 und Windows PowerShell 5.1.',
  'Welches Repo: Basis (das Code-Repo), Projekt (ein geteiltes Projekt-Repo als Overlay mit projects/<slug>) oder Inhalt (dashboard-inhalt). Die Art kommt nur von außerhalb des geprüften Baums: aus der Adresse des Remotes, die der Hook ohnehin bekommt (-RemoteUrl), und der Liste dashboard-inhalt/pruefer/repos.toml (Abschnitt [repos], je Zeile "adresse" = "Basis", "Projekt" oder "Inhalt"). Verglichen wird genau; nur Schema und Rechnername gelten ohne Groß/Klein, und / oder .git am Ende zählen nicht. Was im Baum steht, wählt die Art nie (sonst schaltete ein Verstoß wie projects/<slug> oder pruefer/namen.toml die Prüfung selbst ab). Ohne Adresse (Lauf von Hand, Hochladen.ps1 ohne -Repo), mit einer Adresse, die nicht in der Liste steht, oder ohne repos.toml (dann mit HINWEIS) prüft er als Basis-Repo (geschlossen scheitern); eine kaputte repos.toml bricht ab (Exit 2). Die Adresse selbst steht nie in der Ausgabe. -Art ist nur noch eine Zusicherung für Läufe von Hand: Weicht sie von der Art aus der Adresse ab, bricht er mit Exit 2 ab. Ein neues Remote trägt der Inhaber vor dem ersten Push in repos.toml ein (der Umzug legt sie leer an). Nur im Basis-Repo gelten die Liste nur_basis und die Ortsregeln des Code-Repos (Positivliste, Orte des Inhalts, seit 6d jede Datei *.md außer dem Leitfaden für Mitwirkende in der Wurzel (die Regel gilt auch im Projekt-Repo), projects/<allgemeiner slug>, Projektmodule, Binärdateien außerhalb der Positivliste); alles andere (Benutzerpfade, Benutzername, sensibel, Tabu-Namen, Geheimnis-Dateien, Adressen, Kennungen, Commits und Refs) gilt in jedem Repo.',
  'Art Projekt (geteiltes Projekt-Repo): Ein geteiltes Projekt-Repo ist ein Overlay, kein Fork. Erlaubt sind nur projects/<slug>/… für genau einen Slug und die Wurzeldateien dashboard-version.toml, .gitignore und .gitattributes. Hat das Remote schon main, ist der Slug der Ordner unter projects/ dort (ein Merge, der ihn löscht und einen anderen anlegt, ist ein Fund); sonst der erste, den der Lauf sieht. Jeder weitere ist ein Fund „fremdes Projekt“, auch nur in der Geschichte. Jede andere Datei ist ein Fund, ebenso jede *.md außer dem Leitfaden für Mitwirkende in der Wurzel. nur_basis gilt dort nicht; alles andere wie oben.',
  'Ausnahmedatei (nur Art Projekt): dashboard-inhalt/pruefer/ausnahmen/<name>.toml, <name> ist der letzte Teil der Adresse ohne .git (für …/team/projekt.git also projekt.toml). Gelesen wird sie nur, wenn die Adresse in repos.toml als Projekt steht; in Basis und Inhalt nie. Form: Kommentare und erlaubt = ["…", …]. Ein Eintrag nimmt genau den einen Wert aus sensibel (mit tokens) oder nur_basis heraus, der gefaltet gleich ist (Groß/Klein, Umlaute und Trenner wie beim Prüfer), nie einen Wortteil: Steht ein längerer Wert auf der Liste, der den erlaubten enthält, sperrt er weiter und braucht einen eigenen Eintrag. Frei ist der Wert nur alleinstehend: Steht direkt davor oder dahinter ein Buchstabe oder eine Ziffer (gefaltet, also auch über weggelassene Trenner), bleibt die Zusammensetzung ein Fund, in Pfaden, Text, Commits und Binärdateien gleich. Ein Eintrag ohne solchen Wert ist ein Fund („Ausnahme ohne Listeneintrag, Nr. n“), weil ein Tippfehler sonst still nicht wirkte und ein späterer Listeneintrag still ausgenommen wäre. Fehlt die Datei, gibt es keine Ausnahme; ist sie kaputt, bricht er ab (Exit 2). Die Ausgabe nennt nur die Zahl der angewandten Ausnahmen und verbirgt die ausgenommenen Werte weiter. Zwei Projekt-Adressen in repos.toml mit gleichem letztem Teil teilen sich die Datei. Jede Ausnahme ist eine Lücke in der Vertrauensgrenze: Die Architektur-Rolle nimmt jeden Eintrag einzeln ab.',
  'Hooks im Overlay: Das Projekt-Repo hat kein scripts/. Einmal je Klon git config core.hooksPath <code-repo>/scripts/hooks (absolut). commit-msg und pre-push finden Vor-Push.ps1 neben sich (zwei Ebenen über scripts/hooks) und prüfen das Repo, in dem gepusht wird. Die Namenslisten findet der Prüfer über DASHBOARD_INHALT, sonst im Nachbarordner dashboard-inhalt des Code-Repos, in dem er liegt (nie neben dem Projekt-Repo: dort kann ein anderer Ordner liegen). pre-commit läuft dort mit, prüft Rust aber nur, wenn im Repo eine Cargo.toml liegt. Für das Code-Repo ändert sich nichts.',
  'Hochladen eines Projekt-Repos: scripts/Hochladen.ps1 -Repo <projekt-repo> [-Pruefen]. Es verlangt core.hooksPath auf <code-repo>/scripts/hooks (der Wurzel-Commit entsteht einmal beim Anlegen, danach nur Merge-Commits auf main), prüft den ganzen Baum von main und alle neuen Commits mit der Push-Adresse des Remotes (git remote get-url --push --all, also pushurl, wenn gesetzt; die Art kommt so aus repos.toml; mehrere verschiedene Push-Adressen brechen ab) und lädt dann refs/heads/main nach refs/heads/main hoch. Auch -Pruefen braucht dort das Remote, sonst prüfte er als Basis.',
  'Namenslisten nur in dashboard-inhalt/pruefer/namen.toml: sensibel (in jedem Repo verboten: bürgerliche Namen und ihre Formen, private Projektthemen, markante Wortteile zusammengesetzter Namen), nur_basis (nur im Basis-Repo verboten, in Projekten und im Inhalt erlaubt: Rufnamen und Chat-Namen, die keine gewöhnlichen Wörter sind; Teil eines Wortes zählt, Groß/Klein egal), allgemein (Projektnamen, nur als Pfad projects/<slug> verboten), tabu, benutzer (der Windows-Benutzername, überall verboten, auch ohne Pfad), rechner, wlan, schluessel, mac. Vor dem Vergleich wird gefaltet, nur so weit die Treffer es brauchen: NFC (ein zerlegtes ü wie ein ganzes), Groß/Klein egal, ä/ö/ü/ß wie ae/oe/ue/ss, jeder Strich, Unterstrich, Punkt, Plus, Schrägstrich und Leerzeichen gleich (auch keins, auch über einen Zeilenumbruch). Der Umzug belegt allgemein, tabu, benutzer, rechner und schluessel vor; sensibel und nur_basis trägt der Inhaber ein, bis dahin geht nichts hinaus (im Basis-Repo bricht der Prüfer bei leerer nur_basis ab). Der Prüfer nennt jede Zeile je Muster.',
  'Dazu jede Datei dashboard-inhalt/pruefer/tokens/*.toml: je Quelle eine Datei mit sensibel = [...]; LIESMICH.txt dort zählt nicht. Der Prüfer vereint sie mit sensibel aus namen.toml. Fehlt der Ordner, liegt keine *.toml darin, ist eine Datei leer, kaputt oder ohne sensibel, geht nichts hinaus (Exit 2). Die Meldung nennt die Datei, nie ihren Inhalt.',
  'Commit-Adresse: Autor und Committer sind genau Ranke <ranke2@proton.me>, Zeichen für Zeichen. Ein breites ＠ (U+FF20) oder ein anderes Nicht-ASCII-Zeichen in Name oder Adresse wird abgewiesen. Im Text geht die Adresse nur als ganze Adresse durch.',
  'Keine Anhänge in Commit-Nachrichten: Zeilen oder Wörter wie Co-Authored-By, Signed-off-by, Generated with und Namen von KI-Assistenten, Modellen und ihren Anbietern werden abgewiesen, Groß und Klein egal, auch mit Strichen oder Leerzeichen dazwischen. Dieselben Namen sind im Basis-Repo auch in Dateien, Pfaden und im Inhalt von Binärdateien ein Fund „KI-Name“ (nur der Inhalt von Cargo.lock in der Wurzel ist ausgenommen, wegen der Namen fremder Pakete; in Projekt-Repos sind es oft Fachwörter); eine Adresse eines solchen Anbieters ist keine Ausnahme. Dazu ein Fuß BREAKING CHANGE: (Brüche nur mit ! in der ersten Zeile, seit Teil 3), jeder Trailer, den git selbst erkennt (etwa Reviewed-by oder Change-Id), und jede Kopfzeile im Commit außer tree, parent, author und committer (etwa eine Signatur).',
  'Was der Prüfer sieht, ist was ein Push überträgt : Ersatz-Objekte (git replace) und Grafts gelten für ihn nicht. Lange Zeilen prüft er ganz. Namen findet er auch über einen Zeilenumbruch (Vorname am Zeilenende, Nachname auf der nächsten Zeile, oder am Strich getrennt). Kodierung: Jede Git-Ausgabe (Pfade, Baum-Einträge, Commit-Meldungen, Autor und Committer, Tag-Texte) und jede Textdatei muss gültiges UTF-8 sein (UTF-8 mit BOM geht), eine Textdatei oder Meldung ohne Steuerzeichen außer Tab, LF und CR; sonst ist es ein Fund „kein UTF-8“ mit Datei oder Stelle, nie dem Inhalt. Windows-1252, UTF-16 und UTF-32 sind darum ein Fund; eine zweite Lesart, Escapes (\u, %XX, Entities), Doppelgänger und unsichtbare Zeichen prüft er nicht mehr. Binärdatei ist nur png, jpg, gif, ico, webp und pdf, jede mit passender Signatur (sonst ein Fund „kaputt“); alles andere, auch zip, woff oder bin, ist Text und muss darum gültiges UTF-8 sein. Tags (seit Teil 3): hinaus darf neben refs/heads/main nur ein neuer, leichter Tag refs/tags/v0.MINOR.PATCH (Ziffern ohne führende Null), lokal und fern derselbe Name, dessen Commit auf der First-Parent-Linie von main liegt (main aus demselben Push, sonst was fern schon main ist; ohne main ein Fund). Ein Tag-Objekt (git tag -a/-s), ein Tag, den es fern schon gibt, und Löschen sind ein Fund; ebenso jede Ref auf ein Tag-Objekt. Seit Teil 4 (Versionsregel 0.x, Abschnitt 5) ist ein Tag v0.MINOR.PATCH auch ein Fund, wenn im getaggten Commit Cargo.toml unter [package] nicht genau eine Zeile version = "0.MINOR.PATCH" hat oder in CHANGELOG.txt die oberste Überschrift nach Unreleased (Zeile mit Strichen darunter) nicht 0.MINOR.PATCH - JJJJ-MM-TT mit gültigem Datum ist; gelesen wird mit git show <commit>:Cargo.toml, streng als UTF-8. Binärdateien in web/static und in den Assets der Test-Beispiele vergleicht er ganz mit den Namenslisten (Byte für Byte als Latin-1); ein PNG darf nur die Stücke IHDR, PLTE, IDAT, IEND, tRNS, gAMA, cHRM, sRGB und pHYs haben, ein GIF keinen Kommentar, ein JPEG kein COM. Gepackte Daten (etwa PDF-Streams) sieht er nicht; ein Archiv oder eine Schrift ist kein UTF-8 und darum ein Fund. Enge Ausnahme: das Feld mappings einer Quellkarte (*.map) in web/vendor ist Zufall aus Base64 und zählt nicht.',
  'Der öffentliche Name des Code-Repos ist dashboard-commons. Hinaus geht der lokale Zweig main nach main, nur als Fast-Forward auf das ferne main: auf der First-Parent-Linie nur Merge-Commits (git merge --no-ff), jeder Commit von Ranke <ranke2@proton.me>, Nachricht nach Conventional Commits, ohne Anhänge. Ein Tag liegt auf einem Merge-Commit dieser Linie.',
  'Probelauf ohne Push: scripts/Vor-Push.ps1 -Pruefen prüft refs/heads/main (oder -Ref <ref>) wie einen ersten Push nach main: Name der Ref, alle erreichbaren Commits (Autor, Committer, Nachricht), den ganzen Baum und die ganze Geschichte. scripts/Vor-Push.ps1 -Bundle <datei> prüft ein Git-Bundle ganz: jede Ref darin (nur main, dazu Tags nach der Regel oben auf dessen Linie), alle Commits, Bäume und Blobs, dazu jedes Objekt, das keine Ref erreicht. Ein Bundle, das nicht bei der Wurzel beginnt, bricht ab (Exit 2).',
  'Hochladen nur mit scripts/Hochladen.ps1: bricht ab, wenn main das ferne main nicht enthält (nur Fast-Forward), prüft den ganzen Baum von main und alle neuen Commits (fern..main, auf der First-Parent-Linie nur Merge-Commits), dann git push <remote> refs/heads/main:refs/heads/main (kein --force, kein --no-verify); -Pruefen prüft nur, was hinausginge; -Tag v0.MINOR.PATCH lädt nur diesen Tag hoch (git push <remote> refs/tags/<tag>:refs/tags/<tag>, der Hook prüft); aufgerufen wird es dafür von scripts/Freigeben.ps1, dem einzigen Weg, eine Fassung herauszugeben (Abschnitt 5). Main und Tag gehen so getrennt hinaus; zusammen nur mit git push --atomic. Ohne Remote bricht es ab. Ein Aufruf mit -Wurzel bricht mit einem Satz ab: main geht direkt hinaus.',
  'Kein anderer Weg nach draußen (gilt für alle Chats): kein gh gist, kein gh api mit Schreibzugriff (etwa auf /contents), kein gh release, kein gh issue, kein Hochladen über die Weboberfläche, kein git push von Hand. Diese Wege sieht kein Prüfer; sie sind darum verboten. Ob das Token das Recht für gist gar nicht erst bekommt, entscheidet der Inhaber.',
]
