zeilen = [
  ['/schluessel, /api/schluessel (auch /api/schluessel/passkeys…, …/sitzungen-beenden)', 'Projektseiten, /api/projects, Assets'],
  ['', '/anmelden, /api/passkey/stand, /api/passkey/anmelden/…, /api/passkey/abmelden; /api/passkey/antrag… mit Windows-Anmeldung irgendeines Kontos'],
  ['/vorgaenge, /api/vorgaenge (auch warten)', '/pc und /api/pc mit Rechner-Werten (CPU, Speicher, Platte)'],
  ['/daten, /api/daten (auch Export und Sichern)', 'Dateien der Oberfläche (index.html, JS, CSS)'],
