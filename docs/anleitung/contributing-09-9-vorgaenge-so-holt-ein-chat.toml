[[block]]
text = '''
/api/pc ist frei und enthält nur Rechner-Werte (Prozessor, Speicher, Platte, Dienste, Windows-Stand, pc.toml, Backup je Projekt). Die Benutzer-Daten liegen getrennt unter /api/pc/benutzer; der Browser schickt den Nachweis nur auf geschützten Wegen mit. Ohne Anmeldung antwortet /api/pc/benutzer mit 401, die Seite zeigt dann einen Hinweis statt der Benutzer-Teile.

Dasselbe gilt für Wege, die mit Anmeldung mehr zeigen (Hotfix 3a-1): Ein freier Weg bekommt den Nachweis nur, wenn die Verbindung zufällig schon angemeldet ist, denn Edge meldet erst nach einer 401 mit WWW-Authenticate: Negotiate an. Die Oberfläche liest darum die geschützten Fassungen /api/pc/verlauf/voll und /api/projekte/<slug>/stand/voll und nimmt die freien (/api/pc/verlauf, /api/projekte/<slug>/stand) nur nach 401 oder 403. Die freien Wege bleiben für Werkzeuge. Geprüft: /api/anstehend, /api/antworten und /api/meldungen sind ohnehin geschützt; /api/passkey/stand sagt auf einer nicht angemeldeten Verbindung wie: keine statt hauptkonto. Die Seite /anmelden fragt darum seit 3a+ zuerst den geschützten /api/passkey/antrag (meldet die Verbindung an; sein hauptkonto ist sicher) und erst danach den Stand; den Satz „Du bist mit dem Hauptkonto angemeldet“ setzt sie aus beidem (anmeldeArt in web/src/lib/passkey.ts).'''

[[block]]
titel = 'Passkey und Ausweis (ab 7c)'
text = '''
Schlüssel der Ausweise. Die JWT werden mit Ed25519 signiert. Der Schlüssel (32 Bytes) liegt in geheim/jwt-schluessel neben dem Ordner des Datenspeichers, im Dienst also in C:/ProgramData/Dashboard/geheim/jwt-schluessel. Der Dienst legt Ordner und Datei beim ersten Start selbst an: Vererbung aus, Zugriff nur für SYSTEM, die Administratoren und das Dienstkonto. Eine vorhandene Datei überschreibt er nie. Hat sie nicht genau 32 Bytes, bleibt die Anmeldung mit Passkey aus, und der Grund steht im Protokoll; die Windows-Anmeldung geht weiter. Ohne Einstellungsdatei (Altweg, Testserver) nennt die Umgebungsvariable DASHBOARD_JWT_SCHLUESSEL den Dateipfad; ohne sie gilt geheim/jwt-schluessel neben der Datei aus DASHBOARD_DATEN. Tests nehmen einen Schlüssel nur im Speicher. Nie den echten Schlüssel aus C:/ProgramData kopieren oder anzeigen.

Einmaliger Schritt für bestehende Installationen. Das Dienstkonto darf unter C:/ProgramData/Dashboard selbst keinen Ordner anlegen (Vererbung aus, kein Recht an der Wurzel). Dienst-Einrichten.ps1 legt geheim seit 7c mit an. Wurde der Dienst vorher eingerichtet, einmal als Administrator (Windows-Taste+R, einfügen, Strg+Umschalt+Enter; mit -Pruefen nur ansehen, das geht ohne Administrator):'''

[[block]]
beispiel = '''
C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -NoExit -ExecutionPolicy Bypass -File %USERPROFILE%/dev/dashboard/scripts/Dienst-Einrichten.ps1 -NurGeheim'''

[[block]]
text = '''
Das legt nur C:/ProgramData/Dashboard/geheim an (oder setzt seine Rechte): Vererbung aus, SYSTEM und Administratoren voll, NT SERVICE/Dashboard ändern, sonst niemand; bricht ab außerhalb von main und wenn der Ordner unter ProgramData nicht den Administratoren gehört. Danach ohne Administrator scripts/Dienst.ps1 -Neustart; der Dienst legt den Schlüssel selbst an.

Die einfachen Anführungszeichen sind in PowerShell nötig; ohne sie liest PowerShell die Klammern als Ausdruck („Der Begriff OI wird nicht erkannt“).

Danach den Dienst neu starten; er legt jwt-schluessel darin an. Ohne diesen Schritt bleibt nur die Anmeldung mit Passkey aus (Satz im Protokoll), alles andere läuft.

Edge-Probe. tests/skripte/passkey-edge.mjs prüft den ganzen Weg mit Edge headless (Wegwerf-Profil im Temp-Ordner) und virtuellen Authenticatoren über das DevTools-Protokoll: anlegen (ES256 und RS256), anmelden, Antrag aus einem „anderen“ Konto (dafür stellt die Probe die erwartete SID um), Freigabe mit Vergleichszahl, Widerruf, Abmelden. Server auf Port 8788 aus einer Kopie der exe, mit eigener dienst.toml und eigenen Daten im Temp-Ordner; nie 8787, nie echte Passkeys oder Windows Hello. Aufruf aus dem Repo, nach cargo build und einem Bau der Oberfläche:'''

[[block]]
beispiel = '''
cd web; $env:DASHBOARD_BUILD_ZIEL = "$env:TEMP/dashboard-web-e2e"; npm run build; Remove-Item Env:DASHBOARD_BUILD_ZIEL; cd ..
node tests/skripte/passkey-edge.mjs --web "$env:TEMP/dashboard-web-e2e"'''

[[block]]
text = '''
Ohne --web nimmt sie web/build. Exit 0 heißt bestanden; Server und Edge laufen danach nicht weiter, der Temp-Ordner ist weg (--behalten lässt ihn zum Nachsehen liegen).

Edge-Probe Zeitachse (Etappe 3a-1). tests/skripte/zeitachse-edge.mjs arbeitet genauso (Edge headless, Wegwerf-Profil, Port 8788, Kopie der exe, Daten im Temp-Ordner), aber mit einer KOPIE von projects/ und data/ aus dem Repo, damit alle echten Seiten dabei sind. Die eigene SID steht als inhaber_sid darin; der Sammler liest die Windows-Ereignisse dieses PCs (nur lesend) in den Wegwerf-Speicher. Sie besucht alle Projektseiten mit Zeitstrahl oder Gantt (aus daten/*.toml), /pc und / bei 1280 und 375 px und prüft: keine Fehler in der Konsole, der neue Baustein ist da, keine überlappenden Beschriftungen (Rechtecke der Beschriftungen je Achse), bei 375 px kein seitliches Scrollen (mit Handy-Emulation zählt die Breite des Geräts); dazu Tastatur (Zoom, Verschieben, Pos1, kein Alt+Pfeil) und Touch-Ersatz (Antippen und Ziehen über Input.dispatchTouchEvent) auf Dichtestreifen, Verlauf und Gantt. Mit --bilder <Ordner> legt sie Bildschirmfotos (PNG, ganze Seite) der Dashboard-Projektseite, von /pc und einer Projektseite mit Zeitstrahl bei beiden Breiten ab. Damit die Seiten in neuer Form im Bau sind, vorher die Bauliste schreiben:'''

[[block]]
beispiel = '''
./target/debug/dashboard.exe pruefe --bauliste
cd web; $env:DASHBOARD_BUILD_ZIEL = "$env:TEMP/dashboard-web-e2e"; npm run build; Remove-Item Env:DASHBOARD_BUILD_ZIEL; cd ..
node tests/skripte/zeitachse-edge.mjs --web "$env:TEMP/dashboard-web-e2e" --bilder "$env:TEMP/zeitachse-bilder"'''

[[block]]
text = '''
--nur /pc,/ besucht nur diese Seiten (schneller beim Nachprüfen), --sammler-sekunden 120 sagt, wie lange sie auf die Windows-Ereignisse wartet. Am Ende steht, was nicht bestanden hat, mit Einzelheiten; ein Bericht je Seite liegt als bericht.json neben den Bildern.

Edge-Probe PC (Etappe 3a-4). tests/skripte/pc-edge.mjs arbeitet wie die beiden anderen (Kopie der exe, Kopie von projects/, Port 8788, Netzsperre); aus data/ kopiert sie seit 3a+ nur die eingecheckten Dateien (git ls-files data). Ist Port 8788 oder ein Debug-Port belegt, bricht sie vor dem Start mit klarem Satz ab. Sie wartet, bis der Server gemessen und den Defender gelesen hat, und prüft auf /pc und / bei 375 und 1280 px, hell und dunkel: Die Ampeln Defender, Neustart und Schlüssel und die drei Ringe zeigen die Fachgröße aus /api/pc und /api/pc/benutzer in der passenden Farbe, unbekannt nie grün; keine Fehler in der Konsole, bei 375 px kein seitliches Scrollen. Dazu der freie Weg: ein zweites Edge mit eigenem Profil, das sich bei localhost nicht bei Windows anmeldet; dort sind die geschützten Wege 401, das Cockpit zeigt den Schlüssel als unbekannt, /pc den Satz zur fehlenden Anmeldung und keine Ordner, Starts, Meldungen oder Vorgänge. Aufruf nach cargo build und npm run build: node tests/skripte/pc-edge.mjs.

Edge-Probe Thema (Etappe 3b). tests/skripte/thema-edge.mjs arbeitet wie pc-edge.mjs (Kopie der exe, Kopie von projects/, eingecheckte Dateien aus data/, Port 8788, Netzsperre). Sie prüft die CSP (Prüfsumme des Thema-Skripts, kein 'unsafe-inline' in script-src), dass „Dunkel“ bei hellem System und „Hell“ bei dunklem schon im ersten Bild gelten (gemessen vor allen Skripten der Seite, bei DOMContentLoaded und nach load), den Schalter mit der Tastatur, die Startseite als Spalten (375 px untereinander, 1280 px nebeneinander, Summe gleich der Zählzeile), den Abschnitt „Als Text“ im Katalog und die Logo-Entwürfe hell und dunkel. Aufruf nach cargo build und einem Bau: node tests/skripte/thema-edge.mjs --web <Ordner>.

Für alle Edge-Proben (seit 3a+). Gemeinsames steht in tests/skripte/edge-gemeinsam.mjs (Fristen für CDP in cdp-frist.mjs): Die Netzsperre greift nicht nur auf der Seite, sondern über Target.setAutoAttach (flatten) auf Browser-Ebene auch für Service-Worker, Worker, weitere Seiten und Frames; was nicht an 127.0.0.1 oder localhost geht, bricht ab und lässt die Probe scheitern. Nur Anfragen des Browser-Prozesses selbst erfasst sie nicht; die schalten die Startschalter ab. Server, Edge und Temp-Ordner räumt ein einziges Aufräumen ab (beiAbbruch): im finally um main(), bei Strg+C und bei einem unbehandelten Fehler oder abgelehnten Versprechen (etwa einer Frist, auf die niemand mehr wartet); so bleibt nach keinem Abbruch ein Debug-Port belegt. Das Aufräumen schließt nur ein Edge, das die Probe selbst gestartet hat, und jeder Schritt hat eine Frist.

Ports der Edge-Proben (seit 4b). Jede Probe prüft vor dem Start Port 8788 und beide Edge-Debug-Ports (9788 und 9789; portePruefen in edge-gemeinsam.mjs) und bricht ab, wenn einer belegt ist; jede nimmt --port <n> (dann n, n+1000 und n+1001). Nie zwei Proben zugleich laufen lassen; sonst die zweite mit --port.

Edge-Probe Baumeister (Etappe 4b). tests/skripte/baumeister-edge.mjs --web <Ordner mit index.html> legt eine Wegwerf-Kopie von web/ (Module als Junction), projects/ und den TOML-Dateien aus data/ an, startet den Server im Altweg auf Port 8788 mit DASHBOARD_BAUMEISTER=direkt (baut ohne Boten im eigenen Prozess, gleicher Ablauf wie im Boten; nur für solche Kopien, nie im Dienst) und Edge headless mit Netzsperre. Sie misst ESLint je Projektordner mit --cache und den echten Lauf vom Speichern einer Seite.svelte bis zur neuen Seite in Edge (je Median aus 5, mit den Schritten des Baus). Gemessen wird nie an einem echten Projekt, sondern am erfundenen zz-messung, das die Probe in der Kopie anlegt (projekt.toml und eine minimale Seite.svelte mit dem Messfeld der Probe; ohne Seite.svelte käme die Seite nicht aus dem Bau); für den Klick in 5c ebenso zz-messung-b. Mit --projekt <slug> misst sie an einem echten Projekt (hängt einen Absatz an dessen Seite) und sagt klar, wenn das Feld dort nicht zu sehen ist (Seite rot im Bau oder zeigt den Absatz nicht). Dann die Abnahme: ein absichtlich kaputtes Projekt mit Svelte-Fehler (bleibt in der letzten grünen Fassung), mit Fehler beim Zeichnen (Fehlergrenze mit „neu versuchen“) und mit Fehler beim Klicken (Rahmen); alle anderen Seiten laufen weiter. Dann (mit dem Hinweis am Live-Punkt) ein zweites, bei localhost angemeldetes Edge: Nach dem Bau steht am Live-Punkt „Daten live, App wird gleich aktualisiert“ (Knopf, 44 px, einmal angesagt, bei 360 px ohne Überbreite), und der Tab lädt nach etwa 30 s von selbst (5a); mit Fokus in einem Feld lädt er auch nach 35 s nicht, dort steht „App wird aktualisiert, sobald du fertig bist“, und der Klick auf den Hinweis lädt (5b). In 5c gilt Zustand 1 „Keine Verbindung zum Dienst, Daten können veraltet sein“ (Link, kein Knopf, 360 px): ohne Live-Kanal lädt ein fehlender Teil des alten Baus nicht von selbst neu (unser Merker bleibt leer), und reißt die Verbindung in Zustand 2 ab (Edge offline; spätestens die Frage vor dem Neuladen merkt es), lädt der Tab auch nach 35 s nicht neu; wieder online steht wieder Zustand 2. Zum Schluss der Bau-Stand im Kopf (grün, rot mit „letzte gute Fassung“, ohne Zeitzeile und ohne Kreispfeil, mit und ohne Anmeldung). Optional --runden, --projekt, --behalten, --nur fassung (nur Aufwärmen und der Teil mit dem Hinweis), --nur bau (alter Name --nur knopf; nur Aufwärmen und der Bau-Stand).'''
