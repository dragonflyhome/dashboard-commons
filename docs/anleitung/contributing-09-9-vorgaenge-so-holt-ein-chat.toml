[[block]]
text = '''
Die Stufe einer Meldung ist fest: fehler und frist Jetzt, fertig Bald, info Irgendwann. Der Inhaber kann sie nicht umstufen, nur wegklicken. Wiederholt sich etwas (derselbe schluessel), entsteht keine zweite Meldung: anzahl zählt hoch, und sie ist wieder ungelesen. Ein Zustand (Prüfung rot, Frist nah, Bote fehlt) meldet sich nur einmal, bis er behoben ist.

Selbst melden (nur fertig oder info, nur für dein Projekt):'''

[[block]]
beispiel = '''
pwsh -NoProfile -File %USERPROFILE%/dev/dashboard/scripts/Api.ps1 api/meldungen -Json '{"projekt":"beispiel","art":"fertig","titel":"Rundmail zum Vereinsfest ist fertig","verweis":"ar-20261030-0001"}''''

