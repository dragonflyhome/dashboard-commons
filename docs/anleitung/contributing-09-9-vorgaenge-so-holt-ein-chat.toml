[[block]]
punkte = [
  'Mit verweis ist es dieselbe Meldung wie die, die der Server beim Setzen deiner Arbeit auf fertig anlegt (Schlüssel <projekt>/fertig:<verweis>): Sie zählt nur einmal. Die Antwort ist dann 200 mit "neu": false. Setzt du also eine Arbeit auf fertig, brauchst du keine eigene Meldung mehr; schick eine nur, wenn sie etwas Eigenes sagt (etwa ohne Arbeit dazu).',
  'Ohne verweis zählt eine Wiederholung hoch (200, "neu": false, anzahl höher); neu ist 201 mit {"id","neu":true,"anzahl":1}.',
  'Nichts Vertrauliches in Meldungen. Titel und Text stehen im Band, in „Anstehend“ und auf der Projektseite. Ohne Anmeldung zeigt das Dashboard nur die Zahl der Meldungen, doch schreib trotzdem keine Passwörter, Schlüssel, Links mit Zugangsdaten oder persönlichen Angaben hinein. Das gehört in eine Aufgabe (Link verschlüsselt) oder den Tresor.',
  'Sparsam melden. Höchstens 20 ungelesene Meldungen je Projekt; darüber legt der Server die ältesten als gelesen ab und zählt sie in einer Sammelmeldung („Ältere Meldungen sind als gelesen abgelegt …“). Melde nur, was der Inhaber wirklich wissen sollte; Zwischenstände gehören in deine Arbeit.',
  'Nur per Api.ps1. Aus dem Browser nimmt der Server keine Meldung an (422). „gelesen“ (POST /api/meldungen/<id>/gelesen) nimmt er umgekehrt nur aus dem Browser an: Er prüft die Kopfzeilen Origin und Sec-Fetch-Site. Das schützt vor Versehen, ist aber keine Sicherheitsgrenze; klick nie an Stelle des Inhabers „gelesen“.',
  'Nachsehen: GET /api/meldungen?projekt=<slug> (alle außerhalb des Archivs, neueste zuerst, mit gelesen, behoben, anzahl). In GET /api/anstehend stehen die ungelesenen als art: "meldung"; mit ?projekt=<slug> steht dort auch aktualisierungen (alle Meldungen und Vorgänge des Projekts; die neuesten fünf wählt die Oberfläche). GET /api/projekte/<slug>/stand hat ohne Anmeldung nur zahlen.meldungen (neu, gesamt), keine Titel und Texte.',
  'Ziel: Jede Meldung führt auf /projects/<slug>#meldung-<id>; dort steht sie, solange sie ungelesen ist, in der Zeitleiste unter „Neue Meldungen“ zum Aufklappen; gelesen steht sie nur noch als Zeile im Verlauf, ohne eigenes Ziel. Systemmeldungen führen auf /pc#meldung-<id>.',
  'von ist eine Angabe, kein Nachweis; trotzdem ehrlich setzen.',
]

[[block]]
titel = 'Anmeldung mit dem Windows-Konto (ab Etappe 7b)'
text = 'Das Dashboard prüft bei Vorgängen, Aufgaben, Daten, Schlüsseln und dem Live-Kanal, dass die Anfrage vom Windows-Konto des Inhabers kommt (integrierte Windows-Anmeldung, Negotiate). Ein Passwort wird dabei nie eingegeben; Windows schickt den Nachweis des angemeldeten Kontos selbst mit. Regeln:'

[[block]]
punkte = [
  "Chats und Skripte: scripts/Api.ps1 (Weg, dazu -Json '…' oder -Post für einen POST), etwa pwsh -NoProfile -File %USERPROFILE%/dev/dashboard/scripts/Api.ps1 \"api/vorgaenge?fuer=<slug>&offen=1\". Es fragt über .NET (scripts/Anfrage.ps1, HttpClient mit UseDefaultCredentials). Kein curl: Das curl 8.22, das Windows mit KB5127936 eingespielt hat, kann kein NTLM; mit --negotiate -u : bricht es für ein lokales Konto mit SEC_E_NO_CREDENTIALS ab, der Server antwortet 401. Das curl aus Git oder MSYS2 konnte es nie.",
  'PowerShell 7: Invoke-WebRequest -UseDefaultCredentials -AllowUnencryptedAuthentication (der zweite Schalter gilt nur für diesen Aufruf, keine Systemeinstellung). PowerShell 5.1: nur -UseDefaultCredentials.',
  'Browser: http://localhost:8787. Nur dort meldet der Browser ohne Rückfrage an. Eine geschützte Seite über 127.0.0.1 leitet der Server auf dieselbe Seite unter localhost um.',
  '127.0.0.1 bleibt für Api.ps1, Warten.ps1 und Lebenszeichen; dort klappt die Anmeldung mit den Befehlen oben.',
  'Warten.ps1 macht das alles schon selbst (Exit-Code 7, wenn die Anmeldung fehlt oder das Konto fremd ist).',
  'Schluessel-Lesen.ps1 ändert sich nicht: Es liest den Windows-Tresor direkt und spricht nicht mit dem Server.',
]

[[block]]
text = '''
Antworten des Servers: ohne Anmeldung 401 mit {"fehler":"Bitte mit dem Windows-Konto anmelden.","art":"anmeldung"} und WWW-Authenticate: Negotiate; angemeldet, aber nicht als Inhaber (anderes Windows-Konto ohne gültigen Passkey-Ausweis, seit Etappe 7c): 401 mit "art":"passkey" (ohne Negotiate), Browser-Seiten leiten auf /anmelden?ziel=…. Als Inhaber gilt auch ein gültiger Ausweis (JWT) im Cookie __Host-dashboard nach Anmeldung mit einem registrierten Passkey; für die Skripte und die Chats ändert sich nichts.

Pfade unter /api enthalten nie ein % (sonst 400, Art fehlerhaft; Hotfix Prozent), weil die Schleuse den rohen Pfad prüft, axum Platzhalter aber dekodiert; wer einen Weg mit Platzhalter baut, dessen Wert über den Zugang entscheidet, prüft im Handler zusätzlich Angemeldet (geschützte Dateien in daten/ stehen allein in sicherheit::GESCHUETZTE_DATEIEN).'''

[[block]]
[block.tabelle]
