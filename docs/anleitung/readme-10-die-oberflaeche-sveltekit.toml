# Abschnitt „Die Oberfläche (SvelteKit)“ (Etappe 6b, Format wie docs/zielbild).
titel = 'Die Oberfläche (SvelteKit)'
reihenfolge = 210

[[block]]
text = 'Die Oberfläche ist eine Einzelseiten-App: SvelteKit 3 mit Svelte 5 und strengem TypeScript, Daten vom Rust-Server über die JSON-API, Live- Aktualisierung über den Ereigniskanal. Der Rust-Server liefert das fertige Build unter / aus. Bekannte Seiten (Übersicht, /anstehend, /pc, /schluessel, /hallo, /vorgaenge, /daten, /anmelden, /katalog, ab 4d die System-Seiten /anleitung, /zielbild und /entscheidungen (in der Seitenleiste), vorhandene Projekte und ihre Unterseiten /projects/<slug>/<name>) bekommen index.html; /projects/<slug>/neu und /projects/<slug>/neu/<name> leiten nur noch weiter (307 auf /projects/<slug> bzw. /projects/<slug>/<name>, bei einem unbekannten Projekt 404); unbekannte Adressen antworten seit 3b mit 404, die Seite zeigt dann eine Fehlerseite in einfachem Deutsch mit Link zur Übersicht. Unter /katalog sind seit 3b-2 nur /katalog selbst und /katalog/entwuerfe/logo Seiten; jede andere Adresse darunter gibt 404.'

[[block]]
punkte = [
  'Logo (ab 3b-2): eine Datei, web/static/logo.svg (gewählt: Entwurf 1 „Blüte“), für Kopfleiste, Browser-Reiter, App-Symbol im Manifest und die Seite der Logo-Entwürfe. Das echte Logo ist ein Tausch dieser Datei (Abschnitt „5. Committen“, Teil „Für den Betreuer des Dashboards: das Logo tauschen“); feste Farben nur auf eigener Fläche oder mit prefers-color-scheme im SVG.',
  'Der Baumeister (ab 4b): Der Dienst beobachtet die .svelte- und .ts-Dateien aller Projekte (TOML nie), wartet 5 s Ruhe ab und lässt den Boten bauen; der Vorgang bau läuft in dieselbe Warteschlange (nur noch nötig, wenn der Beobachter etwas verpasst). Der Bote prüft nur geänderte Projekte (TOML, Assets, Scanner, Stil, ESLint mit --cache, svelte-check, Vitest); projekte.generated.ts nennt nur grüne Projekte (absolute Pfade, nur import()), ein rotes bleibt in seiner letzten grünen Kopie web/.projekte-gruen/<slug>/. Danach svelte-check über alles (höchstens zwei Eingriffe: Ein Projekt, das nur diese Gesamtprüfung bricht, wird ab der Abnahme 4c aus seiner grünen Kopie gebaut und bleibt so in seiner letzten guten Fassung; ohne Kopie, oder passt auch die Kopie nicht, fehlt es), daneben npm run build mit 120 s, niedriger Priorität und ohne Fenster (die neue Fassung gilt erst, wenn die Gesamtprüfung grün ist; greift sie ein, wird mit der neuen Liste neu gebaut). Grün: Zeiger umgestellt (Datei und Speicher), Ereignis fassung, aber nur, solange web/src seit dem letzten scripts/Dienst.ps1 -Neustart gleich ist (derselbe Grundbau, siehe unten); sonst wartet der Bau: Die letzte gültige Fassung bleibt, der Vorgang bau endet rot mit diesem Satz, /api/betrieb nennt es unter den Störungen, und erst -Neustart bringt ihn; rot: alte Fassung bleibt, Meldung auf der Startseite. Ein Bau zur Zeit, danach genau ein weiterer. Ein Neustart baut nicht. Jede Projektseite steckt in einer Fehlergrenze: Wirft sie beim Zeichnen oder bei einem Klick einen Fehler, steht dort „Diese Seite hat gerade einen Fehler“ mit „neu versuchen“; der Rest läuft weiter.',
  'Bau-Stand (ab 4c): Jede Seite in neuer Form (mit Seite.svelte) hat einen Bau-Stand: in Ordnung, mit Fehler, nicht geprüft, wird gebaut oder noch nicht gebaut, dazu Tag und Uhrzeit der letzten guten Fassung. Der Dienst liest dafür nur, was der Bote schreibt (web/.projekte-gruen/stand.json und die grünen Kopien), und „wird gebaut“ aus der Warteschlange (src/baustand.rs). Er steht im Kopf der Projektseite („Seite in Ordnung“, bei Fehler „zeigt die letzte gute Fassung von Sa 31.10., 14:05 Uhr“, „Seite noch nicht geprüft“, „Seite wird gebaut …“, „Seite noch nicht gebaut“), als kleine Marke in der Seitenleiste (nur wenn nicht in Ordnung), auf der Karte der Startseite und in ihrer Zählzeile („1 Seite mit Fehler“). Ausgewertet wird nur in web/src/lib/projekte.ts (bauAnzeige; Wächter-Test). Live über das Ereignis bau im geschützten Kanal; ohne Anmeldung gilt der Stand beim Laden (frei in /api/projects). Angemeldet steht im Kopf der Satz zum Fehler oder zur fehlenden Prüfung (ohne Pfade, aus /api/bauen), bei nicht geprüft mit alter Fassung auch deren Zeit in der Zeile; ohne Anmeldung nur der Zustand. Ist stand.json gerade nicht lesbar, steht „Bau-Stand gerade nicht lesbar“ da. Im Kopf steht keine Zeitzeile und kein Knopf zum Bauen; ob die App im Tab veraltet ist oder gebaut wird, sagt der Live-Punkt (nächster Punkt). Einen Bau bestellen Chats mit dem Vorgang bau. Am Server bleibt gebaut_um in stand.json und /api/projects (für Chats).',
  'Neue Fassung im offenen Tab (Grundsatz: Niemand muss etwas anklicken; die App aktualisiert sich selbst): Oben rechts am Live-Punkt steht höchstens einer von drei Zuständen, als Information und ohne Warnfarbe (der Punkt ist dann grau); keine Verbindung geht vor „wird gebaut“, das geht vor „wird gleich aktualisiert“. „Keine Verbindung zum Dienst, Daten können veraltet sein“: Der Live-Kanal ist weg oder die API antwortet nicht; die Seite lädt nie neu, auch nicht nach einem fehlenden Teil des Baus, und verbindet sich selbst wieder. „Daten live, neue Fassung wird gebaut“: Ein Bau läuft (angemeldet das Ereignis bau, ohne Anmeldung der Bau-Stand der Projektliste, die der Tab dann selbst nachholt); nichts lädt neu. „Daten live, App wird gleich aktualisiert“: Das Ereignis fassung (auch ohne Anmeldung) nennt einen neueren Bau als den, mit dem der Tab geladen hat; nach 30 Sekunden lädt die Seite von selbst, ein Klick auf den Knopf lädt sofort. Solange Sie etwas eingeben oder etwas offen ist, das verloren ginge (Fokus in einem Feld, ein offener Dialog oder die Schublade, Text in einem Antwortfeld, ein ausgefülltes Formularfeld, eine Antwort, die gerade gesendet wird, eine offene Rückfrage wie „Freigabe bestätigen“ oder eine laufende Passkey-Abfrage), steht dort „App wird aktualisiert, sobald du fertig bist“ (einmal vorgelesen); ist es vorbei, lädt sie nach 5 Sekunden. Auch der Klick auf den Knopf lädt dann nicht, sondern setzt den Fokus zurück ins Feld. Ein Entwurf bei „Etwas anderes …“ steht schon sicher in sessionStorage und hält nur auf, solange Sie darin schreiben. Jeder Wechsel wird einmal vorgelesen, ohne Countdown. Ein Tab im Hintergrund lädt, sobald Sie ihn wieder ansehen. Bis dahin navigiert der nächste Klick auf einen Link zu einer anderen Seite voll zum Ziel (nicht Zurück/Vor, nicht innerhalb derselben Seite, nicht solange etwas offen ist). Nach dem Neuladen steht der Fokus wieder dort, wo er war, sonst auf dem Inhalt. Nur TOML geändert: kein Bau, kein Hinweis. Fehlt ein Teil des alten Baus (404 nach dem Umstellen), lädt die Seite (außer ohne Verbindung) einmal neu statt einer Fehlerseite oder des Fehlerbilds; ein Merker in sessionStorage verhindert Schleifen (web/src/lib/fassung.ts, fassung.svelte.ts, components/FassungWache.svelte, components/LiveBadge.svelte).',
  'Woher das Build kommt: Der Bau landet in einem neuen Ordner web/builds/<JJJJMMTT-hhmmss>/, der Bote schreibt dessen Namen in die Zeigerdatei web/builds/aktuell. Gilt der Zeiger (nur ein Name, Ordner da, keine Verknüpfung, index.html darin), liefert der Dienst ab der nächsten Anfrage aus diesem Ordner aus, ohne Neustart, solange der Bau denselben Grundbau hat wie bin/web (Abdruck von web/src ohne die Bauliste, in _app/version.json; web/scripts/grundbau.mjs). Ein Bau aus einem neueren web/src kann Wege brauchen, die der laufende Dienst noch nicht kennt; er wartet auf den nächsten -Neustart (bis dahin bleibt der letzte gültige Bau des Boten, ohne ihn bin/web), und /api/betrieb nennt das unter den Störungen. Sonst kommt die Oberfläche des Dienstes aus bin/web neben seinen Programmen: einer Kopie von web/build, die nur scripts/Dienst.ps1 -Neustart zusammen mit den Programmen einspielt (die vorige bleibt als bin/web.alt; der Weg zurück bringt Programm und Oberfläche gemeinsam zurück). Ein npm run build im Repo ändert die laufende Seite darum nicht. Nur wenn bin/web fehlt (etwa vor dem ersten -Neustart) und ohne Dienst (cargo run, Start-Dashboard.ps1) kommt sie aus web/build/. Die letzten zwei Bau-Ordner bleiben liegen (src/app.rs, WebOrt; src/bote/bau.rs).',
  'Quelltext in web/. Einmalig npm install, dann npm run build; das Ergebnis landet in web/build/ (das baut auch scripts/Dienst.ps1 -Neustart und kopiert es dann nach bin/web; der laufende Dienst liest web/build nur, solange bin/web fehlt). scripts/Start-Dashboard.ps1 baut es automatisch mit, wenn Node.js da ist.',
  'Seiten: Übersicht, /anstehend (Aufgaben, Fragen, Arbeiten und Meldungen an einer Stelle, nach Stufe und Schwerpunkt), Projekte (/projects/<slug> mit Unterseiten unter /projects/<slug>/<name>; /projects/<slug>/neu leitet nur noch dorthin weiter), /pc (Symbol oben rechts), dazu in der Seitenleiste /schluessel, /hallo, /vorgaenge und /daten. Seit der Kopfleiste, Fassung 3, zählt die Glocke oben rechts die ungelesenen Meldungen (statt des Bands); Zähler und Tab-Titel ändern sich ohne Neuladen.',
  'Farben (seit 3b): Unten auf jeder Seite stellt der Schalter „Farben“ auf System, Hell oder Dunkel; die Wahl gilt für diesen Browser und steht ab dem ersten Bild, ohne kurzes Aufblitzen.',
  'Als Text (seit 3b): Unter jedem Bild mit Zahlen (Kennzahlen, Fortschritt, Fluss, Balkenplan, PC-Kurven, Dichtestreifen) zeigt „Als Text“ dieselben Zahlen als Tabelle; Screenreader lesen die Tabelle immer.',
  'Spalten (seit 3b): Auf der Übersicht schaltet „Ansicht“ zwischen Kacheln und Spalten, eine Spalte je Status mit Zahl; die Wahl gilt für diesen Browser.',
  'Schwerpunkte: Die Gruppen der Übersicht „Anstehend“ stehen in data/schwerpunkte.toml (von Hand, nach der Antwort des Inhabers): je [[schwerpunkt]] ein name, eine reihenfolge und die projekte (Slugs). Jedes Projekt gehört zu genau einem; ohne Zuordnung steht es unter „Sonstiges“. pruefe meldet unbekannte Projekte, Projekte ohne Zuordnung und doppelte Zuordnungen (src/vertrag/schwerpunkte.rs).',
  'Ohne Anmeldung (etwa über 127.0.0.1 ohne Passkey) fragt die Oberfläche seit 3b einmal je Laden, ob eine Anmeldung möglich ist (web/src/lib/zugang.ts), und lässt die geschützten Abfragen danach aus. Die Schleusen im Server bleiben gleich.',
  'Entwickeln: npm run dev in web/ (Vite auf Port 5173, leitet /api an den Rust-Server weiter). npm run verify prüft alles: Prettier, ESLint (strict-type-checked), svelte-check, Vitest, Build.',
  'Es gibt keine externen Skripte, Schriften oder Tracker; npm-Pakete sind das Einzige, was von außen kommt (package-lock.json ist eingecheckt, npm audit meldet 0 Schwachstellen).',
  'Toolkit als Vendor-Kopie (Etappe 3a-3): Bits UI 2.20.2 und seine 15 Helfer-Pakete liegen in web/vendor/<paket>/. „Unverändert“ heißt dort: jede Datei Byte für Byte wie im Tarball der Registry, mit zwei Ausnahmen, die scripts/Vendor-Holen.ps1 macht und HERKUNFT.toml aufzählt: Die Markdown-Dateien der Pakete fehlen (Liste entfernt), und eine Lizenz als LICENSE.md läge inhaltsgleich als LICENSE.txt da (Liste umbenannt, heute bei keinem Paket). Dazu kommt je Paket nur HERKUNFT.toml (Version, Prüfsummen); npm run verify rechnet die Prüfsumme der Kopie nach. web/package.json zeigt mit file:vendor/<paket> darauf, npm ci braucht dafür kein Netz. web/.npmrc setzt install-links (Kopie statt Verknüpfung) und ignore-scripts (keine Paket-Skripte beim Installieren; unsere Vorstufen stehen darum direkt in build, check, lint und test). Prüfen: scripts/Vendor-Pruefen.ps1; eine neue Fassung zur Durchsicht holen: scripts/Vendor-Holen.ps1 (Abschnitt „5. Committen“, Teil „Für den Betreuer des Dashboards: Toolkit als Vendor-Kopie“).',
  'Katalog unter /katalog (Etappe 3a-3): jeder Baustein aus $katalog mit lebendem Beispiel, einem Satz und wie man ihn benutzt (Grundteile auf Bits UI, Text, Daten, Zeit), dazu die Widgets Stand, Frage, Arbeiten, Fristen und Zuletzt mit je drei Entwürfen und der Wahl des Designteams (Stand und Frage stehen in den vier Teilen jeder Projektseite). Nicht in der Seitenleiste; die Beispieldaten sind erfunden, die Seite selbst fragt den Server nicht. Der Rahmen um jede Seite (web/src/routes/+layout.svelte) startet wie überall den Live-Kanal und lädt Aufgaben, Anstehendes und Passkey-Anträge für die Kopfleiste. Edge-Probe: node tests/skripte/katalog-edge.mjs.',
  'Die Bausteine der Projektseiten (Gantt, Zeitstrahl, Fluss, Reiter …) zeichnet das Frontend aus den JSON-Daten; Zeitachsen lassen sich zoomen, verschieben und filtern.',
  'Verlauf und gemeinsame Zeitachse (Etappe 3a-1): Zeitstrahl, PC-Historie und Startseite zeigen denselben Baustein Verlauf (web/src/lib/katalog/zeit/), eine senkrechte Liste nach Tagen statt Punkten auf einer Achse. Darüber auf /pc der Dichtestreifen (Einträge je Tag: heute und die 90 Tage davor, wie der Server liefert); Gantt steht auf derselben Zeitachse (Zeitachse.svelte, Stufen Tag, Woche, Monat, Jahr). Der Server liefert die Ereignisse als Fakten (/api/pc/verlauf, abgeleitet.ereignisse, ereignisse im Block timeline); Sortieren, Gruppieren, Zusammenfassen, Filtern und die Farbe aus art macht die Oberfläche (web/src/lib/zeit/). Seit 3a-1 hat /api/pc keine Felder hotfixes, updates und boots mehr; die Daten stehen weiter im Datenspeicher (pc_ereignisse) und im Verlauf, die Laufzeit in snapshot.uptime_secs.',
  'Umbau in fünf Etappen: a) API + Live-Kanal, b) Gerüst und Projektseite, c) Bausteine und Cockpit, d) PC- und Schlüssel-Seite, e) Umschalten auf / und Entfernen der alten maud-Vorlagen.',
]
