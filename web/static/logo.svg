<!--
  Logo des Dashboards: Entwurf 1 „Blüte“, vom Inhaber gewählt
  (/katalog/entwuerfe/logo). Dieselben Formen wie LogoBluete.svelte; als img,
  Favicon und App-Symbol wirken keine Token, darum stehen hier die Werte der
  Token accent, on-accent und warn aus web/src/app.css fest, hell und dunkel
  (prefers-color-scheme). In diesem Kommentar nie zwei Bindestriche
  hintereinander: XML verbietet sie dort, das Bild bliebe leer. Diese eine Datei zeigen Kopfleiste, Browser-Reiter,
  App-Symbol im Manifest und die Seite der Logo-Entwürfe; Näheres in
  der Anleitung („Für den Betreuer des Dashboards: das Logo tauschen“). Ohne Skript, ohne Verweise nach außen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .grund { fill: #2563eb; }
    .wasser { fill: #ffffff; opacity: 0.25; }
    .blatt { fill: #ffffff; }
    .aussen { opacity: 0.55; }
    .mitte { opacity: 0.78; }
    .kern { fill: #c46b06; }
    @media (prefers-color-scheme: dark) {
      .grund { fill: #7aa2ff; }
      .wasser, .blatt { fill: #0f1420; }
      .kern { fill: #fbbf24; }
    }
  </style>
  <rect class="grund" x="0" y="0" width="64" height="64" rx="14" fill="#2563eb"/>
  <ellipse class="wasser" cx="32" cy="49" rx="21" ry="3.5"/>
  <path class="blatt aussen" d="M32 47.5C15 46.5 7.5 37.5 8.5 27.5c9 2 17.5 10 23.5 20Z"/>
  <path class="blatt aussen" d="M32 47.5c17-1 24.5-10 23.5-20-9 2-17.5 10-23.5 20Z"/>
  <path class="blatt mitte" d="M32 47.5C21.5 42.5 15.5 30 19.5 18c8 5 12 17 12.5 29.5Z"/>
  <path class="blatt mitte" d="M32 47.5c10.5-5 16.5-17.5 12.5-29.5-8 5-12 17-12.5 29.5Z"/>
  <path class="blatt innen" d="M32 47.5c-7-9.5-7-24.5 0-34.5 7 10 7 25 0 34.5Z"/>
  <circle class="kern" cx="32" cy="42" r="2.5"/>
</svg>
